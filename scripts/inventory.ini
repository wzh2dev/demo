[nodes]
node1 ansible_host=10.0.0.101
node2 ansible_host=10.0.0.102
node3 ansible_host=10.0.0.103

# 证书签发端：root CA 及各中间 CA 的私钥只存在于此
[ca]
node1

# etcd 集群成员
[etcd]
node1
node2
node3

# k8s 控制面（apiserver）
[apiserver]
node1
node2

[all:vars]
ansible_user=vagrant
ansible_password=vagrant
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_become=true
ansible_become_method=sudo
