---
- name: 节点基础配置
  hosts: nodes
  become: true

  handlers:
    - name: 重载 sshd
      ansible.builtin.service:
        name: sshd
        state: reloaded

  tasks:
    - name: 写入集群主机名映射
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED CLUSTER HOSTS"
        block: |
          {% for host in groups['nodes'] %}
          {{ hostvars[host].ansible_host }} {{ host }}.wuzhenhua.com {{ host }}
          {% endfor %}

    - name: 关闭当前已启用的 swap
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0

    - name: 注释 /etc/fstab 中的 swap 挂载项
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: "^([^#].*swap.*)"
        replace: '#\1'

    - name: 临时关闭 SELinux
      ansible.builtin.command: setenforce 0
      when:
        - ansible_selinux.status | default('disabled') == 'enabled'
        - ansible_selinux.mode | default('permissive') == 'enforcing'

    - name: 永久关闭 SELinux
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: "^SELINUX="
        line: "SELINUX=disabled"

    - name: 设置 root 密码
      ansible.builtin.user:
        name: root
        password: "{{ 'root' | password_hash('sha512', 'wuzhenhua') }}"

    - name: 允许 root 远程登录
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^[ \t#]*PermitRootLogin'
        line: "PermitRootLogin yes"
        validate: /usr/sbin/sshd -t -f %s
      notify: 重载 sshd

    - name: 允许密码认证
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^[ \t#]*PasswordAuthentication'
        line: "PasswordAuthentication yes"
        validate: /usr/sbin/sshd -t -f %s
      notify: 重载 sshd

    - name: 创建 /cluster 下的目录
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - /cluster/containerd
        - /cluster/runc
        - /cluster/etcd
        - /cluster/pki
        - /cluster/pki/etcd
        - /cluster/pki/k8s
        - /cluster/kubernetes

    - name: 下载 containerd 压缩包
      ansible.builtin.get_url:
        url: https://github.com/containerd/containerd/releases/download/v1.7.36/containerd-1.7.36-linux-amd64.tar.gz
        dest: /tmp/containerd.tar.gz
      environment:
        http_proxy: http://10.0.0.1:7897
        https_proxy: http://10.0.0.1:7897

    - name: 解压 containerd 到 /cluster/containerd
      ansible.builtin.unarchive:
        src: /tmp/containerd.tar.gz
        dest: /cluster/containerd
        remote_src: true
        creates: /cluster/containerd/bin/containerd

    - name: 下载 runc 并赋予执行权限
      ansible.builtin.get_url:
        url: https://github.com/opencontainers/runc/releases/download/v1.4.3/runc.amd64
        dest: /cluster/runc/runc
        mode: "0755"
      environment:
        http_proxy: http://10.0.0.1:7897
        https_proxy: http://10.0.0.1:7897

    - name: 下载 kubernetes node 压缩包
      ansible.builtin.get_url:
        url: https://dl.k8s.io/v1.27.16/kubernetes-node-linux-amd64.tar.gz
        dest: /tmp/kubernetes-node-linux-amd64.tar.gz
      environment:
        http_proxy: http://10.0.0.1:7897
        https_proxy: http://10.0.0.1:7897

    - name: 解压 kubernetes node 到 /cluster
      ansible.builtin.unarchive:
        src: /tmp/kubernetes-node-linux-amd64.tar.gz
        dest: /cluster
        remote_src: true
        creates: /cluster/kubernetes/node/bin/kubelet

    - name: 下载 kubernetes server 压缩包
      ansible.builtin.get_url:
        url: https://dl.k8s.io/v1.27.16/kubernetes-server-linux-amd64.tar.gz
        dest: /tmp/kubernetes-server-linux-amd64.tar.gz
      environment:
        http_proxy: http://10.0.0.1:7897
        https_proxy: http://10.0.0.1:7897

    - name: 解压 kubernetes server 到 /cluster/kubernetes
      ansible.builtin.unarchive:
        src: /tmp/kubernetes-server-linux-amd64.tar.gz
        dest: /cluster/kubernetes
        remote_src: true
        extra_opts:
          - --strip-components=1
        creates: /cluster/kubernetes/server/bin/kube-apiserver

    - name: 下载 etcd 压缩包
      ansible.builtin.get_url:
        url: https://github.com/etcd-io/etcd/releases/download/v3.5.13/etcd-v3.5.13-linux-amd64.tar.gz
        dest: /tmp/etcd.tar.gz
      environment:
        http_proxy: http://10.0.0.1:7897
        https_proxy: http://10.0.0.1:7897

    - name: 解压 etcd 到 /cluster/etcd
      ansible.builtin.unarchive:
        src: /tmp/etcd.tar.gz
        dest: /cluster/etcd
        remote_src: true
        extra_opts:
          - --strip-components=1
        creates: /cluster/etcd/etcd
