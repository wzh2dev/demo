---
- name: 生成集群 PKI（签发端）
  hosts: ca
  become: true
  tasks:
    - name: 写入 root CA 的 OpenSSL 配置
      ansible.builtin.copy:
        content: |
          [ req ]
          prompt             = no
          distinguished_name = req_distinguished_name
          x509_extensions     = v3_ca

          [ req_distinguished_name ]
          C  = CN
          ST = Jiangsu
          L  = Nanjing
          O  = Wuzhenhua
          OU = IT
          CN = Root CA

          [ v3_ca ]
          basicConstraints       = critical, CA:true, pathlen:1
          keyUsage               = critical, keyCertSign, cRLSign
          subjectKeyIdentifier   = hash
          authorityKeyIdentifier = keyid:always
        dest: /cluster/pki/root.cnf

    - name: 生成 root CA 私钥
      ansible.builtin.command: openssl genrsa -aes256 -out /cluster/pki/root.key -passout pass:root 4096
      args:
        creates: /cluster/pki/root.key

    - name: 生成自签名根证书
      ansible.builtin.command: >
        openssl req -x509 -new
        -config /cluster/pki/root.cnf
        -extensions v3_ca
        -key /cluster/pki/root.key
        -passin pass:root
        -out /cluster/pki/root.crt
        -days 3650
        -sha256
      args:
        creates: /cluster/pki/root.crt

    - name: 校验根证书
      ansible.builtin.command: openssl verify -CAfile /cluster/pki/root.crt /cluster/pki/root.crt
      changed_when: false

    - name: 创建 root CA 的 newcerts / crl 目录
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - /cluster/pki/newcerts
        - /cluster/pki/crl

    - name: 初始化 root CA 的证书数据库 index.txt
      ansible.builtin.file:
        path: /cluster/pki/index.txt
        state: touch
        mode: "0600"
        modification_time: preserve
        access_time: preserve

    - name: 初始化 root CA 的 serial / crlnumber
      ansible.builtin.copy:
        content: "1000"
        dest: "{{ item }}"
        mode: "0600"
        force: false
      loop:
        - /cluster/pki/serial
        - /cluster/pki/crlnumber

    - name: 写入 root CA 的 openssl ca 配置
      ansible.builtin.copy:
        content: |
          [ ca ]
          default_ca = ca_default

          [ ca_default ]
          dir               = /cluster/pki
          crl_dir           = $dir/crl
          new_certs_dir     = $dir/newcerts
          database          = $dir/index.txt
          serial            = $dir/serial
          crlnumber         = $dir/crlnumber

          policy            = policy_strict

          unique_subject    = yes
          copy_extensions   = none

          [ policy_strict ]
          countryName             = match
          stateOrProvinceName     = match
          localityName            = match
          organizationName        = match
          organizationalUnitName  = supplied
          commonName              = supplied
          emailAddress            = optional
        dest: /cluster/pki/root_ca.cnf

    - name: 写入 etcd 中间 CA 的 req 配置
      ansible.builtin.copy:
        content: |
          [ req ]
          prompt             = no
          distinguished_name = req_distinguished_name

          [ req_distinguished_name ]
          C  = CN
          ST = Jiangsu
          L  = Nanjing
          O  = Wuzhenhua
          OU = ETCD
          CN = ETCD CA
        dest: /cluster/pki/etcd/etcd.cnf

    - name: 写入 etcd 中间 CA 的 v3_ca 扩展
      ansible.builtin.copy:
        content: |
          [ v3_ca ]
          basicConstraints       = critical, CA:true, pathlen:0
          keyUsage               = critical, keyCertSign, cRLSign
          subjectKeyIdentifier   = hash
          authorityKeyIdentifier = keyid:always
        dest: /cluster/pki/etcd/etcd.ext

    - name: 生成 etcd 中间 CA 私钥
      ansible.builtin.command: openssl genrsa -aes256 -out /cluster/pki/etcd/etcd.key -passout pass:etcd 4096
      args:
        creates: /cluster/pki/etcd/etcd.key

    - name: 生成 etcd 中间 CA 的 CSR
      ansible.builtin.command: >
        openssl req -new
        -config /cluster/pki/etcd/etcd.cnf
        -key /cluster/pki/etcd/etcd.key
        -passin pass:etcd
        -out /cluster/pki/etcd/etcd.csr
        -sha256
      args:
        creates: /cluster/pki/etcd/etcd.csr

    - name: 用 root CA 签发 etcd 中间 CA 证书
      ansible.builtin.command: >
        openssl ca
        -config /cluster/pki/root_ca.cnf
        -extfile /cluster/pki/etcd/etcd.ext
        -extensions v3_ca
        -cert /cluster/pki/root.crt
        -keyfile /cluster/pki/root.key
        -passin pass:root
        -in /cluster/pki/etcd/etcd.csr
        -out /cluster/pki/etcd/etcd.crt
        -days 1825
        -md sha256
        -batch
        -notext
      args:
        creates: /cluster/pki/etcd/etcd.crt

    - name: 校验 etcd 中间 CA 证书
      ansible.builtin.command: openssl verify -CAfile /cluster/pki/root.crt /cluster/pki/etcd/etcd.crt
      changed_when: false

    - name: 创建 etcd CA 的 newcerts / crl 目录
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - /cluster/pki/etcd/newcerts
        - /cluster/pki/etcd/crl

    - name: 初始化 etcd CA 的证书数据库 index.txt
      ansible.builtin.file:
        path: /cluster/pki/etcd/index.txt
        state: touch
        mode: "0600"
        modification_time: preserve
        access_time: preserve

    - name: 初始化 etcd CA 的 serial / crlnumber
      ansible.builtin.copy:
        content: "1000"
        dest: "{{ item }}"
        mode: "0600"
        force: false
      loop:
        - /cluster/pki/etcd/serial
        - /cluster/pki/etcd/crlnumber

    - name: 写入 etcd CA 的 openssl ca 配置
      ansible.builtin.copy:
        content: |
          [ ca ]
          default_ca = ca_default

          [ ca_default ]
          dir               = /cluster/pki/etcd
          crl_dir           = $dir/crl
          new_certs_dir     = $dir/newcerts
          database          = $dir/index.txt
          serial            = $dir/serial
          crlnumber         = $dir/crlnumber

          policy            = policy_strict

          unique_subject    = yes
          copy_extensions   = none

          [ policy_strict ]
          countryName             = match
          stateOrProvinceName     = match
          localityName            = match
          organizationName        = match
          organizationalUnitName  = match
          commonName              = supplied
          emailAddress            = optional
        dest: /cluster/pki/etcd/etcd_ca.cnf

    - name: 生成各 etcd 成员的 server 证书私钥
      community.crypto.openssl_privatekey:
        path: "/cluster/pki/etcd/server-{{ item }}.key"
        type: RSA
        size: 4096
      loop: "{{ groups['etcd'] }}"

    - name: 生成各 etcd 成员的 server 证书 CSR
      community.crypto.openssl_csr:
        path: "/cluster/pki/etcd/server-{{ item }}.csr"
        privatekey_path: "/cluster/pki/etcd/server-{{ item }}.key"
        country_name: CN
        state_or_province_name: Jiangsu
        locality_name: Nanjing
        organization_name: Wuzhenhua
        organizational_unit_name: ETCD
        common_name: "etcd-server-{{ item }}"
        use_common_name_for_san: false
        basic_constraints:
          - "CA:FALSE"
        basic_constraints_critical: true
        key_usage:
          - digitalSignature
          - keyEncipherment
        key_usage_critical: true
        extended_key_usage:
          - serverAuth
        create_subject_key_identifier: true
        subject_alt_name:
          - "DNS:localhost"
          - "DNS:{{ item }}"
          - "IP:127.0.0.1"
          - "IP:{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['etcd'] }}"

    - name: 用 etcd 中间 CA 签发各成员的 server 证书
      community.crypto.x509_certificate:
        path: "/cluster/pki/etcd/server-{{ item }}.crt"
        csr_path: "/cluster/pki/etcd/server-{{ item }}.csr"
        provider: ownca
        ownca_path: /cluster/pki/etcd/etcd.crt
        ownca_privatekey_path: /cluster/pki/etcd/etcd.key
        ownca_privatekey_passphrase: etcd
        ownca_create_authority_key_identifier: true
        ownca_not_after: "+365d"
        ownca_digest: sha256
      loop: "{{ groups['etcd'] }}"

    - name: 校验各 etcd 成员的 server 证书
      ansible.builtin.command: >
        openssl verify
        -CAfile /cluster/pki/root.crt
        -untrusted /cluster/pki/etcd/etcd.crt
        /cluster/pki/etcd/server-{{ item }}.crt
      changed_when: false
      loop: "{{ groups['etcd'] }}"

    - name: 生成各 etcd 成员的 peer 证书私钥
      community.crypto.openssl_privatekey:
        path: "/cluster/pki/etcd/peer-{{ item }}.key"
        type: RSA
        size: 4096
      loop: "{{ groups['etcd'] }}"

    - name: 生成各 etcd 成员的 peer 证书 CSR
      community.crypto.openssl_csr:
        path: "/cluster/pki/etcd/peer-{{ item }}.csr"
        privatekey_path: "/cluster/pki/etcd/peer-{{ item }}.key"
        country_name: CN
        state_or_province_name: Jiangsu
        locality_name: Nanjing
        organization_name: Wuzhenhua
        organizational_unit_name: ETCD
        common_name: "etcd-peer-{{ item }}"
        use_common_name_for_san: false
        basic_constraints:
          - "CA:FALSE"
        basic_constraints_critical: true
        key_usage:
          - digitalSignature
          - keyEncipherment
        key_usage_critical: true
        extended_key_usage:
          - serverAuth
          - clientAuth
        create_subject_key_identifier: true
        subject_alt_name:
          - "DNS:localhost"
          - "DNS:{{ item }}"
          - "IP:127.0.0.1"
          - "IP:{{ hostvars[item].ansible_host }}"
      loop: "{{ groups['etcd'] }}"

    - name: 用 etcd 中间 CA 签发各成员的 peer 证书
      community.crypto.x509_certificate:
        path: "/cluster/pki/etcd/peer-{{ item }}.crt"
        csr_path: "/cluster/pki/etcd/peer-{{ item }}.csr"
        provider: ownca
        ownca_path: /cluster/pki/etcd/etcd.crt
        ownca_privatekey_path: /cluster/pki/etcd/etcd.key
        ownca_privatekey_passphrase: etcd
        ownca_create_authority_key_identifier: true
        ownca_not_after: "+365d"
        ownca_digest: sha256
      loop: "{{ groups['etcd'] }}"

    - name: 校验各 etcd 成员的 peer 证书
      ansible.builtin.command: >
        openssl verify
        -CAfile /cluster/pki/root.crt
        -untrusted /cluster/pki/etcd/etcd.crt
        /cluster/pki/etcd/peer-{{ item }}.crt
      changed_when: false
      loop: "{{ groups['etcd'] }}"

    - name: 写入 k8s 中间 CA 的 req 配置
      ansible.builtin.copy:
        content: |
          [ req ]
          prompt             = no
          distinguished_name = req_distinguished_name

          [ req_distinguished_name ]
          C  = CN
          ST = Jiangsu
          L  = Nanjing
          O  = Wuzhenhua
          OU = K8S
          CN = K8S CA
        dest: /cluster/pki/k8s/k8s.cnf

    - name: 写入 k8s 中间 CA 的 v3_ca 扩展
      ansible.builtin.copy:
        content: |
          [ v3_ca ]
          basicConstraints       = critical, CA:true, pathlen:0
          keyUsage               = critical, keyCertSign, cRLSign
          subjectKeyIdentifier   = hash
          authorityKeyIdentifier = keyid:always
        dest: /cluster/pki/k8s/k8s.ext

    - name: 生成 k8s 中间 CA 私钥
      ansible.builtin.command: openssl genrsa -aes256 -out /cluster/pki/k8s/k8s.key -passout pass:k8s 4096
      args:
        creates: /cluster/pki/k8s/k8s.key

    - name: 生成 k8s 中间 CA 的 CSR
      ansible.builtin.command: >
        openssl req -new
        -config /cluster/pki/k8s/k8s.cnf
        -key /cluster/pki/k8s/k8s.key
        -passin pass:k8s
        -out /cluster/pki/k8s/k8s.csr
        -sha256
      args:
        creates: /cluster/pki/k8s/k8s.csr

    - name: 用 root CA 签发 k8s 中间 CA 证书
      ansible.builtin.command: >
        openssl ca
        -config /cluster/pki/root_ca.cnf
        -extfile /cluster/pki/k8s/k8s.ext
        -extensions v3_ca
        -cert /cluster/pki/root.crt
        -keyfile /cluster/pki/root.key
        -passin pass:root
        -in /cluster/pki/k8s/k8s.csr
        -out /cluster/pki/k8s/k8s.crt
        -days 1825
        -md sha256
        -batch
        -notext
      args:
        creates: /cluster/pki/k8s/k8s.crt

    - name: 校验 k8s 中间 CA 证书
      ansible.builtin.command: openssl verify -CAfile /cluster/pki/root.crt /cluster/pki/k8s/k8s.crt
      changed_when: false

    - name: 创建 k8s CA 的 newcerts / crl 目录
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - /cluster/pki/k8s/newcerts
        - /cluster/pki/k8s/crl

    - name: 初始化 k8s CA 的证书数据库 index.txt
      ansible.builtin.file:
        path: /cluster/pki/k8s/index.txt
        state: touch
        mode: "0600"
        modification_time: preserve
        access_time: preserve

    - name: 初始化 k8s CA 的 serial / crlnumber
      ansible.builtin.copy:
        content: "1000"
        dest: "{{ item }}"
        mode: "0600"
        force: false
      loop:
        - /cluster/pki/k8s/serial
        - /cluster/pki/k8s/crlnumber

    - name: 写入 k8s CA 的 openssl ca 配置
      ansible.builtin.copy:
        content: |
          [ ca ]
          default_ca = ca_default

          [ ca_default ]
          dir               = /cluster/pki/k8s
          crl_dir           = $dir/crl
          new_certs_dir     = $dir/newcerts
          database          = $dir/index.txt
          serial            = $dir/serial
          crlnumber         = $dir/crlnumber

          policy            = policy_strict

          unique_subject    = yes
          copy_extensions   = none

          [ policy_strict ]
          countryName             = match
          stateOrProvinceName     = match
          localityName            = match
          organizationName        = match
          organizationalUnitName  = match
          commonName              = supplied
          emailAddress            = optional
        dest: /cluster/pki/k8s/k8s_ca.cnf

    - name: 生成各控制面节点的 kube-apiserver 证书私钥
      community.crypto.openssl_privatekey:
        path: "/cluster/pki/k8s/apiserver-{{ item }}.key"
        type: RSA
        size: 4096
      loop: "{{ groups['apiserver'] }}"

    - name: 生成各控制面节点的 kube-apiserver 证书 CSR
      community.crypto.openssl_csr:
        path: "/cluster/pki/k8s/apiserver-{{ item }}.csr"
        privatekey_path: "/cluster/pki/k8s/apiserver-{{ item }}.key"
        country_name: CN
        state_or_province_name: Jiangsu
        locality_name: Nanjing
        organization_name: Wuzhenhua
        organizational_unit_name: K8S
        common_name: "kube-apiserver-{{ item }}"
        use_common_name_for_san: false
        basic_constraints:
          - "CA:FALSE"
        basic_constraints_critical: true
        key_usage:
          - digitalSignature
          - keyEncipherment
        key_usage_critical: true
        extended_key_usage:
          - serverAuth
        create_subject_key_identifier: true
        subject_alt_name:
          - "DNS:localhost"
          - "DNS:{{ item }}"
          - "DNS:kubernetes"
          - "DNS:kubernetes.default"
          - "DNS:kubernetes.default.svc"
          - "DNS:kubernetes.default.svc.cluster"
          - "DNS:kubernetes.default.svc.cluster.local"
          - "IP:127.0.0.1"
          - "IP:{{ hostvars[item].ansible_host }}"
          - "IP:10.96.0.1"
      loop: "{{ groups['apiserver'] }}"

    - name: 用 k8s 中间 CA 签发各控制面节点的 kube-apiserver 证书
      community.crypto.x509_certificate:
        path: "/cluster/pki/k8s/apiserver-{{ item }}.crt"
        csr_path: "/cluster/pki/k8s/apiserver-{{ item }}.csr"
        provider: ownca
        ownca_path: /cluster/pki/k8s/k8s.crt
        ownca_privatekey_path: /cluster/pki/k8s/k8s.key
        ownca_privatekey_passphrase: k8s
        ownca_create_authority_key_identifier: true
        ownca_not_after: "+365d"
        ownca_digest: sha256
      loop: "{{ groups['apiserver'] }}"

    - name: 校验各控制面节点的 kube-apiserver 证书
      ansible.builtin.command: >
        openssl verify
        -CAfile /cluster/pki/root.crt
        -untrusted /cluster/pki/k8s/k8s.crt
        /cluster/pki/k8s/apiserver-{{ item }}.crt
      changed_when: false
      loop: "{{ groups['apiserver'] }}"

    - name: 取回各 etcd 成员的证书与私钥到控制端
      ansible.builtin.fetch:
        src: "/cluster/pki/etcd/{{ item.0 }}-{{ item.1 }}.{{ item.2 }}"
        dest: /tmp/cluster-pki/
        flat: true
      loop: "{{ groups['etcd'] | product(['server', 'peer'], ['crt', 'key']) | list }}"

    - name: 取回各控制面节点的 kube-apiserver 证书与私钥到控制端
      ansible.builtin.fetch:
        src: "/cluster/pki/k8s/apiserver-{{ item.0 }}.{{ item.1 }}"
        dest: /tmp/cluster-pki/
        flat: true
      loop: "{{ groups['apiserver'] | product(['crt', 'key']) | list }}"

    - name: 取回 root CA 证书到控制端
      ansible.builtin.fetch:
        src: /cluster/pki/root.crt
        dest: /tmp/root-ca/
        flat: true

- name: 分发 root CA 证书
  hosts: nodes
  become: true
  tasks:
    - name: 分发 root CA 证书到其余节点
      ansible.builtin.copy:
        src: /tmp/root-ca/root.crt
        dest: /cluster/pki/root.crt
        mode: "0644"
      when: inventory_hostname not in groups['ca']

- name: 分发 etcd 证书
  hosts: etcd
  become: true
  tasks:
    - name: 分发本节点的 etcd server / peer 证书与私钥
      ansible.builtin.copy:
        src: "/tmp/cluster-pki/{{ item.kind }}-{{ inventory_hostname }}.{{ item.ext }}"
        dest: "/cluster/pki/etcd/{{ item.kind }}-{{ inventory_hostname }}.{{ item.ext }}"
        mode: "{{ item.mode }}"
      loop:
        - { kind: server, ext: crt, mode: "0644" }
        - { kind: server, ext: key, mode: "0600" }
        - { kind: peer, ext: crt, mode: "0644" }
        - { kind: peer, ext: key, mode: "0600" }

- name: 分发 kube-apiserver 证书
  hosts: apiserver
  become: true
  tasks:
    - name: 分发本节点的 kube-apiserver 证书与私钥
      ansible.builtin.copy:
        src: "/tmp/cluster-pki/apiserver-{{ inventory_hostname }}.{{ item.ext }}"
        dest: "/cluster/pki/k8s/apiserver-{{ inventory_hostname }}.{{ item.ext }}"
        mode: "{{ item.mode }}"
      loop:
        - { ext: crt, mode: "0644" }
        - { ext: key, mode: "0600" }
