- name: 创建组件安装目录
  ansible.builtin.file:
    path: "/cluster/etcd"
    state: directory

- name: 创建组件数据目录
  ansible.builtin.file:
    path: "/data/etcd"
    state: directory

- name: 下载 etcd
  ansible.builtin.command:
    cmd: >-
      curl
      -fsSL
      -o /tmp/etcd.tar.gz
      https://github.com/etcd-io/etcd/releases/download/v3.5.13/etcd-v3.5.13-linux-amd64.tar.gz
    creates: /tmp/etcd.tar.gz
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    https_proxy: http://192.168.1.1:7897

- name: 解压 etcd
  ansible.builtin.unarchive:
    src: /tmp/etcd.tar.gz
    dest: /cluster/etcd
    extra_opts:
      - --strip-components=1
    creates: /cluster/etcd/etcd

- name: 创建 etcd 配置与数据目录
  ansible.builtin.file:
    path: /data/etcd
    state: directory

- name: 从 CA 主机取回各成员的 server / peer 证书
  ansible.builtin.fetch:
    src: "/cluster/pki/etcd/{{ item.0 }}-{{ inventory_hostname }}.{{ item.1 }}"
    dest: "/tmp/"
    flat: true
  loop: "{{ ['server', 'peer'] | product(['crt', 'key']) | list }}"
  delegate_to: "{{ groups['ca'] | first }}"

- name: 分发各成员的 server / peer 证书
  ansible.builtin.copy:
    src: "/tmp/{{ item.0 }}-{{ inventory_hostname }}.{{ item.1 }}"
    dest: "/cluster/pki/etcd/"
  loop: "{{ ['server', 'peer'] | product(['crt', 'key']) | list }}"

- name: 计算 etcd 初始集群成员列表
  ansible.builtin.set_fact:
    etcd_initial_cluster: "{% for host in groups['etcd'] %}{{ host }}=https://{{ hostvars[host].ansible_host }}:2380{% if not loop.last %},{% endif %}{% endfor %}"

- name: 生成 etcd 配置文件
  ansible.builtin.copy:
    dest: /cluster/etcd/etcd.config.yml
    content: |
      name: {{ inventory_hostname }}
      data-dir: /data/etcd
      listen-peer-urls: https://{{ ansible_host }}:2380
      listen-client-urls: https://{{ ansible_host }}:2379,https://127.0.0.1:2379
      advertise-client-urls: https://{{ ansible_host }}:2379
      initial-advertise-peer-urls: https://{{ ansible_host }}:2380
      initial-cluster: {{ etcd_initial_cluster }}
      initial-cluster-token: etcd-cluster
      initial-cluster-state: new
      client-transport-security:
        cert-file: /cluster/pki/etcd/server-{{ inventory_hostname }}.crt
        key-file: /cluster/pki/etcd/server-{{ inventory_hostname }}.key
        trusted-ca-file: /cluster/pki/etcd/etcd.crt
        client-cert-auth: false
      peer-transport-security:
        cert-file: /cluster/pki/etcd/peer-{{ inventory_hostname }}.crt
        key-file: /cluster/pki/etcd/peer-{{ inventory_hostname }}.key
        trusted-ca-file: /cluster/pki/etcd/etcd.crt
        peer-client-cert-auth: true

- name: 检查 etcd tmux 会话是否存在
  ansible.builtin.command: tmux has-session -t etcd
  register: etcd_tmux_session
  changed_when: false
  failed_when: false

- name: 使用 tmux 后台启动 etcd
  ansible.builtin.command: >
    tmux new-session
    -d
    -s etcd
    /cluster/etcd/etcd
    --config-file /cluster/etcd/etcd.config.yml
  when: etcd_tmux_session.rc != 0

- name: 等待 etcd 接口就绪
  ansible.builtin.command: >
    /cluster/etcd/etcdctl endpoint health
    --endpoints=https://{{ ansible_host }}:2379
    --cacert=/cluster/pki/etcd/etcd.crt
  register: etcd_health
  until: etcd_health.rc == 0
  retries: 20
  delay: 3
  changed_when: false

- name: 查看 etcd 集群成员
  ansible.builtin.command: >
    /cluster/etcd/etcdctl member list
    --endpoints=https://{{ ansible_host }}:2379
    --cacert=/cluster/pki/etcd/etcd.crt
  changed_when: false
