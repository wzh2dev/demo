- name: 安装或更新 Kubernetes 二进制文件
  when: kubernetes_version_state.stdout != '1.27.16'
  block:
    - name: 下载 Kubernetes 节点和服务端安装包
      block:
        - name: 下载 Kubernetes 节点和服务端安装包
          ansible.builtin.get_url:
            url: https://dl.k8s.io/v1.27.16/kubernetes-node-linux-amd64.tar.gz
            dest: "/var/cache/k8s-bootstrap/kubernetes-node-1.27.16-amd64.tar.gz"
            mode: "0644"
            timeout: 60
            use_proxy: false
          register: direct_download
          retries: 2
          delay: 3
          until:
            direct_download is succeeded or (direct_download.msg | default('')) is
            not search('(?i)(timed? out|timeout|connection reset|connection aborted|connection
            refused|temporary failure|temporarily unavailable|network is unreachable|remote
            end closed|unexpected eof|connection closed)')
      rescue:
        - name: 直连下载失败时保留原始错误并停止
          ansible.builtin.fail:
            msg: 直连下载失败：{{ direct_download.msg | default(direct_download) }}
    - name: 下载 Kubernetes 节点和服务端安装包
      block:
        - name: 下载 Kubernetes 节点和服务端安装包
          ansible.builtin.get_url:
            url: https://dl.k8s.io/v1.27.16/kubernetes-server-linux-amd64.tar.gz
            dest: "/var/cache/k8s-bootstrap/kubernetes-server-1.27.16-amd64.tar.gz"
            mode: "0644"
            timeout: 60
            use_proxy: false
          register: direct_download
          retries: 2
          delay: 3
          until:
            direct_download is succeeded or (direct_download.msg | default('')) is
            not search('(?i)(timed? out|timeout|connection reset|connection aborted|connection
            refused|temporary failure|temporarily unavailable|network is unreachable|remote
            end closed|unexpected eof|connection closed)')
      rescue:
        - name: 直连下载失败时保留原始错误并停止
          ansible.builtin.fail:
            msg: 直连下载失败：{{ direct_download.msg | default(direct_download) }}
    - name: 解压 Kubernetes 节点和服务端二进制文件
      ansible.builtin.unarchive:
        src: "/var/cache/k8s-bootstrap/kubernetes-node-1.27.16-amd64.tar.gz"
        dest: "/cluster"
        remote_src: true
    - name: 解压 Kubernetes 节点和服务端二进制文件
      ansible.builtin.unarchive:
        src: "/var/cache/k8s-bootstrap/kubernetes-server-1.27.16-amd64.tar.gz"
        dest: "/cluster"
        remote_src: true
    - name: 记录成功安装的 Kubernetes 版本
      ansible.builtin.copy:
        dest: "/cluster/.versions/kubernetes"
        content: |
          1.27.16
        mode: "0644"
- name: 配置 containerd CRI 使用 systemd cgroups
  notify: 重启 containerd 服务
  ansible.builtin.copy:
    dest: "/cluster/containerd/config.toml"
    owner: root
    group: root
    mode: "0644"
    content: |
      version = 2

      [plugins."io.containerd.grpc.v1.cri"]
        sandbox_image = "registry.k8s.io/pause:3.9"

        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
          runtime_type = "io.containerd.runc.v2"

          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
            BinaryName = "/cluster/runc/runc"
            SystemdCgroup = true
- name: 安装 containerd 的 systemd 服务单元
  notify: 重启 containerd 服务
  ansible.builtin.copy:
    dest: "/etc/systemd/system/containerd.service"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=containerd container runtime
      Documentation=https://containerd.io
      After=network.target

      [Service]
      Type=notify
      ExecStart=/cluster/containerd/bin/containerd --config /cluster/containerd/config.toml
      Environment=PATH=/cluster/containerd/bin:/cluster/runc:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      Restart=always
      RestartSec=5
      Delegate=yes
      KillMode=process
      LimitNOFILE=1048576
      LimitNPROC=infinity
      LimitCORE=infinity
      TasksMax=infinity
      OOMScoreAdjust=-999

      [Install]
      WantedBy=multi-user.target
- name: 应用运行时配置变更
  ansible.builtin.meta: flush_handlers
- name: 启用并启动 containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true
