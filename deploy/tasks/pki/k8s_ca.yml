- name: 创建 k8s 中间 CA 工作目录
  ansible.builtin.file:
    path: /cluster/pki/k8s
    state: directory

- name: 生成 k8s 中间 CA 私钥
  ansible.builtin.command: openssl genrsa -out /cluster/pki/k8s/k8s.key 4096
  args:
    creates: /cluster/pki/k8s/k8s.key

- name: 写入 k8s 中间 CA 证书签名请求配置
  ansible.builtin.template:
    src: ../templates/pki/k8s.cnf.j2
    dest: /cluster/pki/k8s/k8s.cnf

- name: 生成 k8s 中间 CA 证书签名请求
  ansible.builtin.command: >
    openssl req -new
    -config /cluster/pki/k8s/k8s.cnf
    -key /cluster/pki/k8s/k8s.key
    -out /cluster/pki/k8s/k8s.csr
    -sha256
  args:
    creates: /cluster/pki/k8s/k8s.csr

- name: 写入 k8s 中间 CA 证书扩展配置
  ansible.builtin.template:
    src: ../templates/pki/k8s.ext.j2
    dest: /cluster/pki/k8s/k8s.ext

- name: 使用根 CA 签发 k8s 中间 CA 证书
  ansible.builtin.command: >
    openssl ca
    -config /cluster/pki/root/root_ca.cnf
    -extfile /cluster/pki/k8s/k8s.ext
    -extensions v3_ca
    -cert /cluster/pki/root/root.crt
    -keyfile /cluster/pki/root/root.key
    -passin pass:root
    -in /cluster/pki/k8s/k8s.csr
    -out /cluster/pki/k8s/k8s.crt
    -days 1825
    -md sha256
    -batch
    -notext
  args:
    creates: /cluster/pki/k8s/k8s.crt

- name: 校验 k8s 中间 CA 证书
  ansible.builtin.command: openssl verify -CAfile /cluster/pki/root/root.crt /cluster/pki/k8s/k8s.crt
  changed_when: false

- name: 创建 k8s 中间 CA 的 newcerts / crl 目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - /cluster/pki/k8s/newcerts
    - /cluster/pki/k8s/crl

- name: 初始化 k8s 中间 CA 证书数据库 index.txt
  ansible.builtin.file:
    path: /cluster/pki/k8s/index.txt
    state: touch
    modification_time: preserve
    access_time: preserve

- name: 初始化 k8s 中间 CA 的 serial / crlnumber
  ansible.builtin.copy:
    content: "1000"
    dest: "{{ item }}"
    force: false
  loop:
    - /cluster/pki/k8s/serial
    - /cluster/pki/k8s/crlnumber

- name: 写入 k8s 中间 CA 签发配置
  ansible.builtin.template:
    src: ../templates/pki/k8s_ca.cnf.j2
    dest: /cluster/pki/k8s/k8s_ca.cnf
