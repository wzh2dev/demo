- name: 创建 zot 证书工作目录
  ansible.builtin.file:
    path: /cluster/pki/zot
    state: directory

- name: 签发并校验 zot server 证书
  block:
    - name: 生成各 registry 成员的 server 证书私钥
      ansible.builtin.command: openssl genrsa -out /cluster/pki/zot/zot-{{ item }}.key 4096
      args:
        creates: /cluster/pki/zot/zot-{{ item }}.key
      loop: "{{ groups['registry'] }}"

    - name: 生成各 registry 成员的 server 证书签名请求配置
      ansible.builtin.template:
        src: ../templates/pki/zot.cnf.j2
        dest: /cluster/pki/zot/zot-{{ item }}.cnf
      loop: "{{ groups['registry'] }}"

    - name: 生成各 registry 成员的 server 证书签名请求
      ansible.builtin.command: >
        openssl req -new
        -config /cluster/pki/zot/zot-{{ item }}.cnf
        -key /cluster/pki/zot/zot-{{ item }}.key
        -out /cluster/pki/zot/zot-{{ item }}.csr
        -sha256
      args:
        creates: /cluster/pki/zot/zot-{{ item }}.csr
      loop: "{{ groups['registry'] }}"

    - name: 生成各 registry 成员的 server 证书扩展配置
      ansible.builtin.template:
        src: ../templates/pki/zot.ext.j2
        dest: /cluster/pki/zot/zot-{{ item }}.ext
      loop: "{{ groups['registry'] }}"

    - name: 使用根 CA 签发各 registry 成员的 server 证书
      ansible.builtin.command: >
        openssl ca
        -config /cluster/pki/root/root_ca.cnf
        -extfile /cluster/pki/zot/zot-{{ item }}.ext
        -extensions v3_req
        -cert /cluster/pki/root/root.crt
        -keyfile /cluster/pki/root/root.key
        -passin pass:root
        -in /cluster/pki/zot/zot-{{ item }}.csr
        -out /cluster/pki/zot/zot-{{ item }}.crt
        -days 365
        -md sha256
        -batch
        -notext
      args:
        creates: /cluster/pki/zot/zot-{{ item }}.crt
      loop: "{{ groups['registry'] }}"

    - name: 校验各 registry 成员的 server 证书
      ansible.builtin.command: >
        openssl verify
        -CAfile /cluster/pki/root/root.crt
        /cluster/pki/zot/zot-{{ item }}.crt
      changed_when: false
      loop: "{{ groups['registry'] }}"
