- name: 分发 CA 证书到节点
  block:
    - name: 分发 root CA 证书到其余节点
      ansible.builtin.copy:
        src: /cluster/pki/root/root.crt
        dest: /cluster/pki/root/root.crt

    - name: 分发 etcd 中间 CA 证书到其余节点
      ansible.builtin.copy:
        src: /cluster/pki/etcd/etcd.crt
        dest: /cluster/pki/etcd/etcd.crt

    - name: 分发 k8s 中间 CA 证书到其余节点
      ansible.builtin.copy:
        src: /cluster/pki/k8s/k8s.crt
        dest: /cluster/pki/k8s/k8s.crt

    - name: 分发 front-proxy CA 证书到其余节点
      ansible.builtin.copy:
        src: /cluster/pki/front-proxy/front-proxy-ca.crt
        dest: /cluster/pki/front-proxy/front-proxy-ca.crt
