    - name: 使用 k8s 中间 CA 签发 kube-apiserver 访问 kubelet 的客户端证书
      ansible.builtin.command: >
        openssl ca
        -config /cluster/pki/k8s/k8s_ca.cnf
        -extfile /cluster/pki/k8s/apiserver-kubelet-client.ext
        -extensions v3_req
        -cert /cluster/pki/k8s/k8s.crt
        -keyfile /cluster/pki/k8s/k8s.key
        -in /cluster/pki/k8s/apiserver-kubelet-client.csr
        -out /cluster/pki/k8s/apiserver-kubelet-client.crt
        -days 365
        -md sha256
        -batch
        -notext
      args:
        creates: /cluster/pki/k8s/apiserver-kubelet-client.crt

    - name: 校验 kube-apiserver 访问 kubelet 的客户端证书
      ansible.builtin.command: >
        openssl verify
        -purpose sslclient
        -CAfile /cluster/pki/root/root.crt
        -untrusted /cluster/pki/k8s/k8s.crt
        /cluster/pki/k8s/apiserver-kubelet-client.crt
