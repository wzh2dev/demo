        dest: /cluster/pki/etcd/peer-{{ item }}.cnf
        content: |
          [ req ]
          prompt             = no
          distinguished_name = req_distinguished_name

          [ req_distinguished_name ]
          C  = CN
          ST = Jiangsu
          L  = Nanjing
          O  = Wuzhenhua
          OU = ETCD
          CN = etcd-peer-{{ item }}
      loop: "{{ groups['etcd'] }}"

    - name: 生成各 etcd 成员的 peer 证书签名请求
