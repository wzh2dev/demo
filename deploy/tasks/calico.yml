- name: 部署 Tigera Operator
  block:
    - name: 下载 Tigera Operator 清单文件
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/projectcalico/calico/v{{ calico_version }}/manifests/tigera-operator.yaml
        dest: /cluster/k8s/tigera-operator.yaml
      environment:
        https_proxy: "http://10.0.0.1:7897"

    - name: 部署 Tigera Operator
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply --server-side -f /cluster/k8s/tigera-operator.yaml
      register: tigera_operator_result
      changed_when: "'unchanged' not in tigera_operator_result.stdout"

    - name: 等待 tigera-operator 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status deployment/tigera-operator -n tigera-operator --timeout=60s
      register: tigera_operator_ready
      until: tigera_operator_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

- name: 部署 Calico
  block:
    - name: 生成 Installation 自定义资源清单
      ansible.builtin.copy:
        dest: /cluster/k8s/calico-installation.yaml
        content: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
                - blockSize: {{ pod_cidr_mask_size }}
                  cidr: {{ pod_cidr }}
                  encapsulation: VXLANCrossSubnet
                  natOutgoing: Enabled
                  nodeSelector: all()

    - name: 部署 Installation 自定义资源
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/calico-installation.yaml
      register: calico_installation_result
      retries: 10
      delay: 3
      changed_when: "'unchanged' not in calico_installation_result.stdout"

    # Operator 自 v3.20 起将 Calico 组件部署在 calico-system 命名空间
    - name: 等待 calico-node 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status daemonset/calico-node -n calico-system --timeout=60s
      register: calico_node_ready
      until: calico_node_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: 等待 calico-kube-controllers 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status deployment/calico-kube-controllers -n calico-system --timeout=60s
      register: calico_controllers_ready
      until: calico_controllers_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false
