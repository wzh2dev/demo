- name: 创建组件安装目录
  ansible.builtin.file:
    path: /cluster/crictl
    state: directory

- name: 安装 crictl
  block:
    - name: 下载 crictl 压缩包
      ansible.builtin.get_url:
        url: https://github.com/kubernetes-sigs/cri-tools/releases/download/v{{ crictl_version }}/crictl-v{{ crictl_version }}-linux-{{ arch }}.tar.gz
        dest: /tmp/crictl.tar.gz
      delegate_to: localhost
      run_once: true
      become: false

    - name: 解压 crictl 到 /cluster/crictl
      ansible.builtin.unarchive:
        src: /tmp/crictl.tar.gz
        dest: /cluster/crictl
        creates: /cluster/crictl/crictl

    - name: 生成 crictl 配置文件
      ansible.builtin.copy:
        dest: /etc/crictl.yaml
        content: |
          runtime-endpoint: unix:///run/containerd/containerd.sock
