- name: 创建组件安装目录
  ansible.builtin.file:
    path: /cluster/crictl
    state: directory

- name: 安装 crictl
  block:
    - name: 下载 crictl 压缩包
      ansible.builtin.command:
        cmd: >-
          curl -fsSL
          -o /tmp/crictl.tar.gz
          https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.37.0/crictl-v1.37.0-linux-amd64.tar.gz
        creates: /tmp/crictl.tar.gz
      delegate_to: localhost
      run_once: true
      become: false
      environment:
        https_proxy: http://192.168.1.1:7897

    - name: 解压 crictl 到 /cluster/crictl
      ansible.builtin.unarchive:
        src: /tmp/crictl.tar.gz
        dest: /cluster/crictl
        creates: /cluster/crictl/crictl

    - name: 生成 crictl 配置文件
      ansible.builtin.copy:
        dest: /etc/crictl.yaml
        content: |
          runtime-endpoint: unix:///run/containerd/containerd.sock
