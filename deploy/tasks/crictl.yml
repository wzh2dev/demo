- name: 创建组件安装目录
  ansible.builtin.file:
    path: /cluster/crictl
    state: directory

- name: 安装 crictl
  block:
    - name: 下载 crictl 压缩包
      tags: [download]
      ansible.builtin.get_url:
        url: https://github.com/kubernetes-sigs/cri-tools/releases/download/{{ crictl_version }}/crictl-{{ crictl_version }}-linux-{{ arch }}.tar.gz
        dest: /tmp/crictl.tar.gz
      delegate_to: localhost
      run_once: true
      become: false
      environment:
        https_proxy: "http://10.0.0.1:7897"

    - name: 解压 crictl 到 /cluster/crictl
      ansible.builtin.unarchive:
        src: /tmp/crictl.tar.gz
        dest: /cluster/crictl
        creates: /cluster/crictl/crictl

    # WARN[0000] Config "/etc/crictl.yaml" does not exist, trying next: "/cluster/crictl/crictl.yaml"
    - name: 生成 crictl 配置文件
      ansible.builtin.copy:
        dest: /etc/crictl.yaml
        content: |
          runtime-endpoint: unix:///run/containerd/containerd.sock
