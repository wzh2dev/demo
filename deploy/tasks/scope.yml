- name: 部署 Weave Scope
  block:
    # 清单内容取自官方 release 资产 v1.13.2 的 k8s-scope.yaml，仅将镜像 tag 参数化
    - name: 生成 Weave Scope 清单文件
      ansible.builtin.copy:
        dest: /cluster/k8s/weave-scope.yaml
        content: |
          apiVersion: v1
          kind: List
          items:
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: weave
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                labels:
                  name: weave-scope
                name: weave-scope
                namespace: weave
              rules:
                - apiGroups:
                    - ""
                  resources:
                    - pods
                    - pods/log
                    - replicationcontrollers
                    - services
                    - namespaces
                    - persistentvolumes
                    - persistentvolumeclaims
                  verbs:
                    - get
                    - list
                    - watch
                - apiGroups:
                    - ""
                  resources:
                    - pods
                  verbs:
                    - delete
                - apiGroups:
                    - apps
                  resources:
                    - deployments
                    - statefulsets
                    - daemonsets
                  verbs:
                    - get
                    - list
                    - watch
                - apiGroups:
                    - batch
                  resources:
                    - cronjobs
                    - jobs
                  verbs:
                    - get
                    - list
                    - watch
                - apiGroups:
                    - extensions
                  resources:
                    - daemonsets
                    - deployments
                    - deployments/scale
                    - replicasets
                  verbs:
                    - get
                    - list
                    - watch
                - apiGroups:
                    - extensions
                  resources:
                    - deployments/scale
                  verbs:
                    - update
                - apiGroups:
                    - apps
                  resources:
                    - deployments/scale
                  verbs:
                    - get
                    - update
                - apiGroups:
                    - storage.k8s.io
                  resources:
                    - storageclasses
                  verbs:
                    - list
                    - watch
                - apiGroups:
                    - extensions
                  resourceNames:
                    - weave-scope
                  resources:
                    - podsecuritypolicies
                  verbs:
                    - use
                - apiGroups:
                    - volumesnapshot.external-storage.k8s.io
                  resources:
                    - volumesnapshots
                    - volumesnapshotdatas
                  verbs:
                    - list
                    - watch
                - apiGroups:
                    - ""
                  resources:
                    - nodes
                  verbs:
                    - get
                    - list
                    - watch
                    - update
                    - patch
            - apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: weave-scope
                labels:
                  name: weave-scope
                namespace: weave
              roleRef:
                kind: ClusterRole
                name: weave-scope
                apiGroup: rbac.authorization.k8s.io
              subjects:
                - kind: ServiceAccount
                  name: weave-scope
                  namespace: weave
            - apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: weave-scope-app
                labels:
                  name: weave-scope-app
                  app: weave-scope
                  weave-cloud-component: scope
                  weave-scope-component: app
                namespace: weave
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: weave-scope
                revisionHistoryLimit: 2
                template:
                  metadata:
                    labels:
                      name: weave-scope-app
                      app: weave-scope
                      weave-cloud-component: scope
                      weave-scope-component: app
                  spec:
                    containers:
                      - name: app
                        args:
                          - '--no-probe'
                        env: [ ]
                        image: weaveworks/scope:{{ scope_version }}
                        imagePullPolicy: IfNotPresent
                        ports:
                          - containerPort: 4040
                            protocol: TCP
                        resources:
                          requests:
                            cpu: 200m
                            memory: 200Mi
            - apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: weave-scope-agent
                labels:
                  name: weave-scope-agent
                  app: weave-scope
                  weave-cloud-component: scope
                  weave-scope-component: agent
                namespace: weave
              spec:
                minReadySeconds: 5
                selector:
                  matchLabels:
                    app: weave-scope
                template:
                  metadata:
                    labels:
                      name: weave-scope-agent
                      app: weave-scope
                      weave-cloud-component: scope
                      weave-scope-component: agent
                  spec:
                    containers:
                      - name: scope-agent
                        args:
                          - '--mode=probe'
                          - '--probe-only'
                          - '--probe.kubernetes.role=host'
                          - '--probe.docker.bridge=docker0'
                          - '--probe.docker=true'
                          - 'weave-scope-app.weave.svc.{{ cluster_domain }}.:80'
                        env:
                          - name: SCOPE_HOSTNAME
                            valueFrom:
                              fieldRef:
                                fieldPath: spec.nodeName
                        image: weaveworks/scope:{{ scope_version }}
                        imagePullPolicy: IfNotPresent
                        resources:
                          requests:
                            cpu: 100m
                            memory: 100Mi
                        securityContext:
                          privileged: true
                        volumeMounts:
                          - name: docker-socket
                            mountPath: /var/run/docker.sock
                          - name: scope-plugins
                            mountPath: /var/run/scope/plugins
                          - name: sys-kernel-debug
                            mountPath: /sys/kernel/debug
                    dnsPolicy: ClusterFirstWithHostNet
                    hostNetwork: true
                    hostPID: true
                    tolerations:
                      - effect: NoSchedule
                        operator: Exists
                    volumes:
                      - name: docker-socket
                        hostPath:
                          path: /var/run/docker.sock
                      - name: scope-plugins
                        hostPath:
                          path: /var/run/scope/plugins
                      - name: sys-kernel-debug
                        hostPath:
                          path: /sys/kernel/debug
                updateStrategy:
                  rollingUpdate:
                    maxUnavailable: 1
            - apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: weave-scope-cluster-agent
                labels:
                  name: weave-scope-cluster-agent
                  app: weave-scope
                  weave-cloud-component: scope
                  weave-scope-component: cluster-agent
                namespace: weave
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    name: weave-scope-cluster-agent
                    app: weave-scope
                    weave-cloud-component: scope
                    weave-scope-component: cluster-agent
                revisionHistoryLimit: 2
                template:
                  metadata:
                    labels:
                      name: weave-scope-cluster-agent
                      app: weave-scope
                      weave-cloud-component: scope
                      weave-scope-component: cluster-agent
                  spec:
                    containers:
                      - name: scope-cluster-agent
                        args:
                          - '--mode=probe'
                          - '--probe-only'
                          - '--probe.kubernetes.role=cluster'
                          - 'weave-scope-app.weave.svc.{{ cluster_domain }}.:80'
                        command:
                          - /home/weave/scope
                        image: 'docker.io/weaveworks/scope:{{ scope_version }}'
                        imagePullPolicy: IfNotPresent
                        resources:
                          requests:
                            cpu: 100m
                            memory: 100Mi
                        volumeMounts:
                          - name: scope-plugins
                            mountPath: /var/run/scope/plugins
                    serviceAccountName: weave-scope
                    volumes:
                      - name: scope-plugins
                        hostPath:
                          path: /var/run/scope/plugins
            - apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: weave-scope
                labels:
                  name: weave-scope
                namespace: weave
            - apiVersion: v1
              kind: Service
              metadata:
                name: weave-scope-app
                labels:
                  name: weave-scope-app
                  app: weave-scope
                  weave-cloud-component: scope
                  weave-scope-component: app
                namespace: weave
              spec:
                ports:
                  - name: app
                    port: 80
                    protocol: TCP
                    targetPort: 4040
                selector:
                  name: weave-scope-app
                  app: weave-scope
                  weave-cloud-component: scope
                  weave-scope-component: app

    - name: 应用 Weave Scope 清单
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/weave-scope.yaml
      register: scope_apply_result
      changed_when: "'unchanged' not in scope_apply_result.stdout"

    - name: 等待 weave-scope-app 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status deployment/weave-scope-app -n weave --timeout=60s
      register: scope_app_ready
      until: scope_app_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: 等待 weave-scope-cluster-agent 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status deployment/weave-scope-cluster-agent -n weave --timeout=60s
      register: scope_cluster_ready
      until: scope_cluster_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: 等待 weave-scope-agent 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status daemonset/weave-scope-agent -n weave --timeout=60s
      register: scope_agent_ready
      until: scope_agent_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

- name: 通过 ingress-nginx 暴露 Scope
  block:
    - name: 生成 Scope Ingress 清单
      ansible.builtin.copy:
        dest: /cluster/k8s/weave-scope-ingress.yaml
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: weave-scope
            namespace: weave
            annotations:
              nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
              nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - scope.wuzhenhua.com
            rules:
              - host: scope.wuzhenhua.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: weave-scope-app
                          port:
                            number: 80

    - name: 应用 Scope Ingress
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/weave-scope-ingress.yaml
      register: scope_ingress_result
      changed_when: "'unchanged' not in scope_ingress_result.stdout"
