- name: 部署 Weave Scope
  block:
    - name: 生成 Weave Scope 清单文件
      ansible.builtin.copy:
        src: ../files/weave-scope.yaml
        dest: /cluster/k8s/weave-scope.yaml

    - name: 应用 Weave Scope 清单
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/weave-scope.yaml
      register: scope_apply_result
      changed_when: "'unchanged' not in scope_apply_result.stdout"

    - name: 等待 weave-scope-app 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status deployment/weave-scope-app -n weave --timeout=60s
      register: scope_app_ready
      until: scope_app_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: 等待 weave-scope-cluster-agent 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status deployment/weave-scope-cluster-agent -n weave --timeout=60s
      register: scope_cluster_ready
      until: scope_cluster_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: 等待 weave-scope-agent 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status daemonset/weave-scope-agent -n weave --timeout=60s
      register: scope_agent_ready
      until: scope_agent_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

- name: 通过 ingress-nginx 暴露 Scope
  block:
    - name: 生成 Scope Ingress 清单
      ansible.builtin.copy:
        src: ../files/weave-scope-ingress.yaml
        dest: /cluster/k8s/weave-scope-ingress.yaml

    - name: 应用 Scope Ingress
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/weave-scope-ingress.yaml
      register: scope_ingress_result
      changed_when: "'unchanged' not in scope_ingress_result.stdout"
