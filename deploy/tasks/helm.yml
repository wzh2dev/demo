- name: 创建组件安装目录
  ansible.builtin.file:
    path: /cluster/helm
    state: directory

- name: 安装 helm
  block:
    - name: 下载 helm 压缩包
      tags: [download]
      ansible.builtin.get_url:
        url: https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ arch }}.tar.gz
        dest: /tmp/helm.tar.gz
      environment:
        https_proxy: "http://10.0.0.1:7897"

    - name: 解压 helm 到 /cluster/helm
      ansible.builtin.unarchive:
        src: /tmp/helm.tar.gz
        dest: /cluster/helm
        extra_opts:
          - --strip-components=1
        creates: /cluster/helm/helm
