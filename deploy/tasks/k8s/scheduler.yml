- name: 分发 kube-scheduler 证书及私钥
  block:
    - name: 从 CA 主机取回 kube-scheduler 客户端证书及私钥
      ansible.builtin.fetch:
        src: /cluster/pki/k8s/scheduler-client.{{ item }}
        dest: /tmp/
        flat: true
      loop:
        - crt
        - key
      run_once: true
      delegate_to: "{{ groups['ca'] | first }}"

    - name: 分发 kube-scheduler 客户端证书及私钥
      ansible.builtin.copy:
        src: /tmp/scheduler-client.{{ item }}
        dest: /cluster/pki/k8s/
      loop:
        - crt
        - key

- name: 部署 kube-scheduler
  block:
    - name: 生成 kube-scheduler kubeconfig
      ansible.builtin.copy:
        dest: /cluster/k8s/scheduler.kubeconfig
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: kubernetes
              cluster:
                server: https://127.0.0.1:6443
                certificate-authority: /cluster/pki/k8s/k8s.crt
          users:
            - name: system:kube-scheduler
              user:
                client-certificate: /cluster/pki/k8s/scheduler-client.crt
                client-key: /cluster/pki/k8s/scheduler-client.key
          contexts:
            - name: system:kube-scheduler@kubernetes
              context:
                cluster: kubernetes
                user: system:kube-scheduler
          current-context: system:kube-scheduler@kubernetes

    - name: 检查 kube-scheduler 的 tmux 会话是否存在
      ansible.builtin.command: tmux has-session -t scheduler
      register: scheduler_tmux_session
      changed_when: false
      failed_when: false

    - name: 使用 tmux 后台启动 kube-scheduler
      ansible.builtin.command: >-
        tmux new-session -d -s scheduler
        "/cluster/k8s/server/bin/kube-scheduler
        --kubeconfig=/cluster/k8s/scheduler.kubeconfig
        --leader-elect=true
        --v=2"
      when: scheduler_tmux_session.rc != 0

    - name: 等待 kube-scheduler 选主 Lease 可读取
      ansible.builtin.command: >
        curl -fsS --cacert /cluster/pki/k8s/k8s.crt
        --cert /cluster/pki/k8s/scheduler-client.crt
        --key /cluster/pki/k8s/scheduler-client.key
        https://127.0.0.1:6443/apis/coordination.k8s.io/v1/namespaces/kube-system/leases/kube-scheduler
      register: scheduler_ready
      until: scheduler_ready.rc == 0
      retries: 30
      delay: 3
      changed_when: false
