- name: 分发 kube-controller-manager 证书及私钥
  block:
    - name: 从 CA 主机取回 kube-controller-manager 客户端证书及私钥
      ansible.builtin.fetch:
        src: /cluster/pki/k8s/controller-manager-client.{{ item }}
        dest: /tmp/
        flat: true
      loop:
        - crt
        - key
      run_once: true
      delegate_to: "{{ groups['ca'] | first }}"

    - name: 分发 kube-controller-manager 客户端证书及私钥
      ansible.builtin.copy:
        src: /tmp/controller-manager-client.{{ item }}
        dest: /cluster/pki/k8s/
      loop:
        - crt
        - key

    - name: 从 CA 主机取回 Kubernetes 中间 CA 私钥
      ansible.builtin.fetch:
        src: /cluster/pki/k8s/k8s.key
        dest: /tmp/
        flat: true
      run_once: true
      delegate_to: "{{ groups['ca'] | first }}"

    - name: 分发 Kubernetes 中间 CA 私钥
      ansible.builtin.copy:
        src: /tmp/k8s.key
        dest: /cluster/pki/k8s/k8s.key

- name: 部署 kube-controller-manager
  block:
    - name: 构建 kube-apiserver 访问地址
      ansible.builtin.set_fact:
        apiserver_endpoint: "https://{{ hostvars[groups['apiserver'] | first].ansible_host }}:6443"

    - name: 生成 kube-controller-manager kubeconfig
      ansible.builtin.copy:
        dest: /cluster/k8s/controller-manager.kubeconfig
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: local
              cluster:
                server: {{ apiserver_endpoint }}
                certificate-authority: /cluster/pki/k8s/k8s.crt
          users:
            - name: cm
              user:
                client-certificate: /cluster/pki/k8s/controller-manager-client.crt
                client-key: /cluster/pki/k8s/controller-manager-client.key
          contexts:
            - name: cm@local
              context:
                cluster: local
                user: cm
          current-context: cm@local

    - name: 检查 kube-controller-manager 的 tmux 会话是否存在
      ansible.builtin.command: tmux has-session -t controller-manager
      register: controller_manager_tmux_session
      changed_when: false
      failed_when: false

    - name: 使用 tmux 后台启动 kube-controller-manager
      ansible.builtin.command: >-
        tmux new-session -d -s controller-manager
        "/cluster/k8s/server/bin/kube-controller-manager
        --kubeconfig=/cluster/k8s/controller-manager.kubeconfig
        --root-ca-file=/cluster/pki/k8s/k8s.crt
        --service-account-private-key-file=/cluster/pki/k8s/sa.key
        --service-account-issuer=https://kubernetes.default.svc.cluster.local
        --service-cluster-ip-range=192.168.3.0/24
        --allocate-node-cidrs=true
        --cluster-cidr=192.168.2.0/24
        --node-cidr-mask-size=26
        --cluster-signing-cert-file=/cluster/pki/k8s/k8s.crt
        --cluster-signing-key-file=/cluster/pki/k8s/k8s.key
        --leader-elect=true
        --use-service-account-credentials=true
        --controllers=*,-tokencleaner
        --v=2"
      when: controller_manager_tmux_session.rc != 0

    - name: 等待 kube-controller-manager 选主 Lease 可读取
      ansible.builtin.command: >
        curl -fsS --cacert /cluster/pki/k8s/k8s.crt
        --cert /cluster/pki/k8s/controller-manager-client.crt
        --key /cluster/pki/k8s/controller-manager-client.key
        {{ apiserver_endpoint }}/apis/coordination.k8s.io/v1/namespaces/kube-system/leases/kube-controller-manager
      register: controller_manager_ready
      until: controller_manager_ready.rc == 0
      retries: 30
      delay: 3
      changed_when: false
