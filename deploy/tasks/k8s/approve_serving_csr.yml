- name: 审批 kubelet serving 证书 CSR
  block:
    - name: 等待所有 kubelet 节点提交 serving CSR
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          get csr
          --field-selector=spec.signerName=kubernetes.io/kubelet-serving
          -o json
      register: serving_csr_query
      vars:
        serving_csrs: "{{ (serving_csr_query.stdout | from_json)['items'] }}"
      until:
        - serving_csr_query.rc == 0
        - serving_csrs | length >= (groups['kubelet'] | length)
      retries: 36
      delay: 5
      changed_when: false

    - name: 审批 Pending 状态的 serving CSR
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          certificate approve {{ item }}
      loop: >-
        {{ (serving_csr_query.stdout | from_json)['items']
        | selectattr('status.conditions', 'undefined')
        | map(attribute='metadata.name')
        | list }}

    - name: 等待 serving 证书全部签发完成
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          get csr
          --field-selector=spec.signerName=kubernetes.io/kubelet-serving
          -o json
      register: issued_csr_query
      vars:
        issued_csrs: >-
          {{ (issued_csr_query.stdout | from_json)['items']
          | selectattr('status.certificate', 'defined')
          | list }}
      until:
        - issued_csr_query.rc == 0
        - issued_csrs | length >= (groups['kubelet'] | length)
      retries: 24
      delay: 5
      changed_when: false
