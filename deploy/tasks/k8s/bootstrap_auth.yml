- name: 准备 kubelet TLS Bootstrap 集群资源
  block:
    - name: 生成 bootstrap token Secret 清单文件
      ansible.builtin.copy:
        dest: /cluster/k8s/bootstrap-token-secret.yaml
        content: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: bootstrap-token-000001
            namespace: kube-system
          type: bootstrap.kubernetes.io/token
          stringData:
            token-id: "000001"
            token-secret: "0000000000000001"
            usage-bootstrap-authentication: "true"
            usage-bootstrap-signing: "false"

    - name: 创建 bootstrap token Secret
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/bootstrap-token-secret.yaml

    - name: 生成 bootstrap 授权及 CSR 自动审批清单文件
      ansible.builtin.copy:
        dest: /cluster/k8s/bootstrap-rbac.yaml
        content: |
          # 1. 允许 bootstrap 组提交首次 CSR
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: kubelet-bootstrap
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:node-bootstrapper
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: system:bootstrappers
          ---
          # 2. 自动批准首次 node client 证书
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: auto-approve-csrs-for-group
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:certificates.k8s.io:certificatesigningrequests:nodeclient
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: system:bootstrappers
          ---
          # 3. 自动批准客户端证书轮换
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: auto-approve-csrs-selfnodeclient
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:certificates.k8s.io:certificatesigningrequests:selfnodeclient
          subjects:
            - apiGroup: rbac.authorization.k8s.io
              kind: Group
              name: system:nodes

    - name: 创建 bootstrap 授权及 CSR 自动审批绑定
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/bootstrap-rbac.yaml
