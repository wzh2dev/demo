- name: 准备 kubelet TLS Bootstrap 集群资源
  block:
    - name: 生成 bootstrap token Secret 清单文件
      ansible.builtin.template:
        src: ../templates/k8s/bootstrap-token-secret.yaml.j2
        dest: /cluster/k8s/bootstrap-token-secret.yaml

    - name: 创建 bootstrap token Secret
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/bootstrap-token-secret.yaml

    - name: 查询 bootstrap token 列表
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          get secrets -n kube-system
          --field-selector type=bootstrap.kubernetes.io/token
      register: bootstrap_token_list
      changed_when: false

    - name: 显示 bootstrap token 列表
      ansible.builtin.debug:
        var: bootstrap_token_list.stdout_lines

    - name: 生成 bootstrap 授权及 CSR 自动审批清单文件
      ansible.builtin.template:
        src: ../templates/k8s/bootstrap-rbac.yaml.j2
        dest: /cluster/k8s/bootstrap-rbac.yaml

    - name: 创建 bootstrap 授权及 CSR 自动审批绑定
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/bootstrap-rbac.yaml

    - name: 查询 ClusterRoleBinding 列表
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          get clusterrolebinding
      register: clusterrolebinding_list
      changed_when: false

    - name: 显示 ClusterRoleBinding 列表
      ansible.builtin.debug:
        var: clusterrolebinding_list.stdout_lines
