- name: 生成 CoreDNS 清单文件
  ansible.builtin.copy:
    dest: /cluster/k8s/coredns.yaml
    content: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: coredns
        namespace: kube-system
        labels:
          kubernetes.io/cluster-service: "true"
          addonmanager.kubernetes.io/mode: Reconcile
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: system:coredns
        labels:
          kubernetes.io/bootstrapping: rbac-defaults
          addonmanager.kubernetes.io/mode: Reconcile
      rules:
        - apiGroups: [""]
          resources: ["endpoints", "services", "pods", "namespaces"]
          verbs: ["list", "watch"]
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get"]
        - apiGroups: ["discovery.k8s.io"]
          resources: ["endpointslices"]
          verbs: ["list", "watch"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: system:coredns
        annotations:
          rbac.authorization.kubernetes.io/autoupdate: "true"
        labels:
          kubernetes.io/bootstrapping: rbac-defaults
          addonmanager.kubernetes.io/mode: EnsureExists
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:coredns
      subjects:
        - kind: ServiceAccount
          name: coredns
          namespace: kube-system
      ---
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: coredns
        namespace: kube-system
        labels:
          addonmanager.kubernetes.io/mode: EnsureExists
      data:
        Corefile: |
          .:53 {
              errors
              health {
                  lameduck 5s
              }
              ready
              kubernetes wuzhenhua.com in-addr.arpa ip6.arpa {
                  pods insecure
                  fallthrough in-addr.arpa ip6.arpa
                  ttl 30
              }
              prometheus :9153
              forward . /etc/resolv.conf {
                  max_concurrent 1000
              }
              cache 30
              loop
              reload
              loadbalance
          }
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: coredns
        namespace: kube-system
        labels:
          k8s-app: kube-dns
          kubernetes.io/cluster-service: "true"
          addonmanager.kubernetes.io/mode: Reconcile
          kubernetes.io/name: "CoreDNS"
      spec:
        replicas: 2
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
        selector:
          matchLabels:
            k8s-app: kube-dns
        template:
          metadata:
            labels:
              k8s-app: kube-dns
          spec:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            priorityClassName: system-cluster-critical
            serviceAccountName: coredns
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchExpressions:
                          - key: k8s-app
                            operator: In
                            values: ["kube-dns"]
                      topologyKey: kubernetes.io/hostname
            tolerations:
              - key: CriticalAddonsOnly
                operator: Exists
              - key: node-role.kubernetes.io/control-plane
                effect: NoSchedule
            nodeSelector:
              kubernetes.io/os: linux
            containers:
              - name: coredns
                image: registry.k8s.io/coredns/coredns:{{ coredns_version }}
                imagePullPolicy: IfNotPresent
                resources:
                  limits:
                    memory: 170Mi
                  requests:
                    cpu: 100m
                    memory: 70Mi
                args: ["-conf", "/etc/coredns/Corefile"]
                volumeMounts:
                  - name: config-volume
                    mountPath: /etc/coredns
                    readOnly: true
                ports:
                  - containerPort: 53
                    name: dns
                    protocol: UDP
                  - containerPort: 53
                    name: dns-tcp
                    protocol: TCP
                  - containerPort: 9153
                    name: metrics
                    protocol: TCP
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                    scheme: HTTP
                  initialDelaySeconds: 60
                  timeoutSeconds: 5
                  successThreshold: 1
                  failureThreshold: 5
                readinessProbe:
                  httpGet:
                    path: /ready
                    port: 8181
                    scheme: HTTP
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    add: ["NET_BIND_SERVICE"]
                    drop: ["all"]
                  readOnlyRootFilesystem: true
            dnsPolicy: Default
            volumes:
              - name: config-volume
                configMap:
                  name: coredns
                  items:
                    - key: Corefile
                      path: Corefile
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: kube-dns
        namespace: kube-system
        annotations:
          prometheus.io/port: "9153"
          prometheus.io/scrape: "true"
        labels:
          k8s-app: kube-dns
          kubernetes.io/cluster-service: "true"
          addonmanager.kubernetes.io/mode: Reconcile
          kubernetes.io/name: "CoreDNS"
      spec:
        selector:
          k8s-app: kube-dns
        clusterIP: {{ cluster_dns }}
        ports:
          - name: dns
            port: 53
            protocol: UDP
            targetPort: 53
          - name: dns-tcp
            port: 53
            protocol: TCP
          - name: metrics
            port: 9153
            protocol: TCP

- name: 部署 CoreDNS
  ansible.builtin.command:
    cmd: >-
      /cluster/k8s/client/bin/kubectl
      --kubeconfig=/cluster/k8s/admin.kubeconfig
      apply -f /cluster/k8s/coredns.yaml
  register: coredns_apply_result
  changed_when: "'unchanged' not in coredns_apply_result.stdout"

- name: 等待 coredns 就绪
  ansible.builtin.command: >-
    /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
    rollout status deployment/coredns -n kube-system --timeout=60s
  register: coredns_ready
  until: coredns_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: 查询 kube-dns 的 ClusterIP
  ansible.builtin.command: >-
    /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
    get service kube-dns -n kube-system -o jsonpath='{.spec.clusterIP}'
  register: kube_dns_cluster_ip
  changed_when: false

- name: 校验 kube-dns 的 ClusterIP 与 kubelet clusterDNS 一致
  ansible.builtin.assert:
    that:
      - kube_dns_cluster_ip.stdout | trim == cluster_dns
    fail_msg: >-
      kube-dns ClusterIP={{ kube_dns_cluster_ip.stdout | trim }}，
      与 kubelet 配置的 clusterDNS {{ cluster_dns }} 不一致
    success_msg: kube-dns ClusterIP={{ cluster_dns }}
