- name: 安装 skopeo
  ansible.builtin.yum:
    name: skopeo
    state: present

- name: 定义待同步镜像清单
  tags: [mirror]
  ansible.builtin.set_fact:
    zot_mirrors:
      - { src: "registry.k8s.io/pause:3.8", dest: "pause:3.8" }
      - { src: "registry.k8s.io/coredns/coredns:{{ coredns_version }}", dest: "coredns/coredns:{{ coredns_version }}" }
      - { src: "registry.k8s.io/metrics-server/metrics-server:{{ metrics_server_version }}", dest: "metrics-server/metrics-server:{{ metrics_server_version }}" }
      - { src: "registry.k8s.io/ingress-nginx/controller:{{ ingress_nginx_version }}", dest: "ingress-nginx/controller:{{ ingress_nginx_version }}" }
      - { src: "registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.6.0", dest: "ingress-nginx/kube-webhook-certgen:v1.6.0" }
      - { src: "quay.io/tigera/operator:v1.32.12", dest: "tigera/operator:v1.32.12" }
      - { src: "quay.io/metallb/controller:{{ metallb_version }}", dest: "metallb/controller:{{ metallb_version }}" }
      - { src: "quay.io/metallb/speaker:{{ metallb_version }}", dest: "metallb/speaker:{{ metallb_version }}" }
      - { src: "docker.io/calico/pod2daemon-flexvol:{{ calico_version }}", dest: "calico/pod2daemon-flexvol:{{ calico_version }}" }
      - { src: "docker.io/calico/cni:{{ calico_version }}", dest: "calico/cni:{{ calico_version }}" }
      - { src: "docker.io/calico/node:{{ calico_version }}", dest: "calico/node:{{ calico_version }}" }
      - { src: "docker.io/calico/typha:{{ calico_version }}", dest: "calico/typha:{{ calico_version }}" }
      - { src: "docker.io/calico/csi:{{ calico_version }}", dest: "calico/csi:{{ calico_version }}" }
      - { src: "docker.io/calico/node-driver-registrar:{{ calico_version }}", dest: "calico/node-driver-registrar:{{ calico_version }}" }
      - { src: "docker.io/calico/kube-controllers:{{ calico_version }}", dest: "calico/kube-controllers:{{ calico_version }}" }
      - { src: "docker.io/kubernetesui/dashboard:{{ dashboard_version }}", dest: "kubernetesui/dashboard:{{ dashboard_version }}" }
      - { src: "docker.io/kubernetesui/metrics-scraper:v1.0.8", dest: "kubernetesui/metrics-scraper:v1.0.8" }
      - { src: "docker.io/weaveworks/scope:{{ scope_version }}", dest: "weaveworks/scope:{{ scope_version }}" }

- name: 检查 zot 中镜像是否已存在
  tags: [mirror]
  ansible.builtin.command: >
    skopeo inspect
    --tls-verify=false
    docker://10.0.0.104:8080/{{ item.dest }}
  loop: "{{ zot_mirrors }}"
  loop_control:
    label: "{{ item.dest }}"
  register: zot_mirror_check
  changed_when: false
  failed_when: false

- name: 下载镜像并推送到 zot
  tags: [mirror]
  ansible.builtin.command: >
    skopeo copy
    docker://{{ item.item.src }}
    docker://10.0.0.104:8080/{{ item.item.dest }}
    --dest-tls-verify=false
  loop: "{{ zot_mirror_check.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: item.rc != 0
  changed_when: false
  environment:
    HTTPS_PROXY: "http://10.0.0.1:7897"
    NO_PROXY: "10.0.0.104"
