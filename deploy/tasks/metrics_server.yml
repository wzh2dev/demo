- name: 部署 metrics-server
  block:
    - name: 生成 k8s CA ConfigMap 清单文件
      ansible.builtin.shell: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        create configmap k8s-ca -n kube-system
        --from-file=k8s.crt=/cluster/pki/k8s/k8s.crt
        --dry-run=client -o yaml
        > /cluster/k8s/metrics-server-ca.yaml
      changed_when: false

    - name: 应用 k8s CA ConfigMap
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        apply -f /cluster/k8s/metrics-server-ca.yaml
      register: metrics_server_ca_configmap
      changed_when: "'unchanged' not in metrics_server_ca_configmap.stdout"

    - name: 生成 metrics-server 清单文件
      ansible.builtin.copy:
        dest: /cluster/k8s/metrics-server.yaml
        content: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            labels:
              k8s-app: metrics-server
            name: metrics-server
            namespace: kube-system
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            labels:
              k8s-app: metrics-server
              rbac.authorization.k8s.io/aggregate-to-admin: "true"
              rbac.authorization.k8s.io/aggregate-to-edit: "true"
              rbac.authorization.k8s.io/aggregate-to-view: "true"
            name: system:aggregated-metrics-reader
          rules:
          - apiGroups:
            - metrics.k8s.io
            resources:
            - pods
            - nodes
            verbs:
            - get
            - list
            - watch
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            labels:
              k8s-app: metrics-server
            name: system:metrics-server
          rules:
          - apiGroups:
            - ""
            resources:
            - nodes/metrics
            verbs:
            - get
          - apiGroups:
            - ""
            resources:
            - pods
            - nodes
            verbs:
            - get
            - list
            - watch
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            labels:
              k8s-app: metrics-server
            name: metrics-server-auth-reader
            namespace: kube-system
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: extension-apiserver-authentication-reader
          subjects:
          - kind: ServiceAccount
            name: metrics-server
            namespace: kube-system
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            labels:
              k8s-app: metrics-server
            name: metrics-server:system:auth-delegator
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:auth-delegator
          subjects:
          - kind: ServiceAccount
            name: metrics-server
            namespace: kube-system
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            labels:
              k8s-app: metrics-server
            name: system:metrics-server
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:metrics-server
          subjects:
          - kind: ServiceAccount
            name: metrics-server
            namespace: kube-system
          ---
          apiVersion: v1
          kind: Service
          metadata:
            labels:
              k8s-app: metrics-server
            name: metrics-server
            namespace: kube-system
          spec:
            ports:
            - name: https
              port: 443
              protocol: TCP
              targetPort: https
            selector:
              k8s-app: metrics-server
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            labels:
              k8s-app: metrics-server
            name: metrics-server
            namespace: kube-system
          spec:
            selector:
              matchLabels:
                k8s-app: metrics-server
            strategy:
              rollingUpdate:
                maxUnavailable: 0
            template:
              metadata:
                labels:
                  k8s-app: metrics-server
              spec:
                containers:
                - args:
                  - --cert-dir=/tmp
                  - --secure-port=10250
                  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
                  - --kubelet-use-node-status-port
                  - --kubelet-certificate-authority=/etc/kubernetes/pki/k8s.crt
                  - --metric-resolution=15s
                  image: registry.k8s.io/metrics-server/metrics-server:v{{ metrics_server_version }}
                  imagePullPolicy: IfNotPresent
                  livenessProbe:
                    failureThreshold: 3
                    httpGet:
                      path: /livez
                      port: https
                      scheme: HTTPS
                    periodSeconds: 10
                  name: metrics-server
                  ports:
                  - containerPort: 10250
                    name: https
                    protocol: TCP
                  readinessProbe:
                    failureThreshold: 3
                    httpGet:
                      path: /readyz
                      port: https
                      scheme: HTTPS
                    initialDelaySeconds: 20
                    periodSeconds: 10
                  resources:
                    requests:
                      cpu: 100m
                      memory: 200Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                    readOnlyRootFilesystem: true
                    runAsNonRoot: true
                    runAsUser: 1000
                    seccompProfile:
                      type: RuntimeDefault
                  volumeMounts:
                  - mountPath: /tmp
                    name: tmp-dir
                  - mountPath: /etc/kubernetes/pki
                    name: k8s-ca
                    readOnly: true
                nodeSelector:
                  kubernetes.io/os: linux
                priorityClassName: system-cluster-critical
                serviceAccountName: metrics-server
                volumes:
                - emptyDir: {}
                  name: tmp-dir
                - configMap:
                    name: k8s-ca
                  name: k8s-ca
          ---
          apiVersion: apiregistration.k8s.io/v1
          kind: APIService
          metadata:
            labels:
              k8s-app: metrics-server
            name: v1beta1.metrics.k8s.io
          spec:
            group: metrics.k8s.io
            groupPriorityMinimum: 100
            insecureSkipTLSVerify: true
            service:
              name: metrics-server
              namespace: kube-system
            version: v1beta1
            versionPriority: 100
    - name: 应用 metrics-server 清单
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/metrics-server.yaml
      register: metrics_server_apply_result
      changed_when: "'unchanged' not in metrics_server_apply_result.stdout"

    - name: 等待 metrics-server 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status deployment/metrics-server -n kube-system --timeout=60s
      register: metrics_server_ready
      until: metrics_server_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    # pod 就绪不代表指标可用（聚合 API 注册、kubelet 抓取都可能失败），
    # 以「返回体中含 usage 字段」作为真正的验收标准。
    - name: 等待 metrics API 返回指标
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        get --raw /apis/metrics.k8s.io/v1beta1/nodes
      register: metrics_api_ready
      until: metrics_api_ready.rc == 0 and '"usage"' in metrics_api_ready.stdout
      retries: 20
      delay: 10
      changed_when: false
