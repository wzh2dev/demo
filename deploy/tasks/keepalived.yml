- name: 安装 keepalived
  ansible.builtin.yum:
    name: keepalived
    state: present

- name: 生成 keepalived 配置
  ansible.builtin.copy:
    dest: /etc/keepalived/keepalived.conf
    content: |
      global_defs {
          router_id {{ inventory_hostname }}
      }

      vrrp_script check_apiserver {
          script "/bin/bash -c 'curl -sfk https://127.0.0.1:6443/healthz -o /dev/null'"
          interval 2
          fall 3
          rise 2
      }

      vrrp_instance VI_1 {
          state BACKUP
          interface eth1
          virtual_router_id 51
          priority {{ keepalived_priority[inventory_hostname] }}
          advert_int 1
          nopreempt

          authentication {
              auth_type PASS
              auth_pass 1111
          }

          virtual_ipaddress {
              {{ keepalived_vip }}/24
          }

          unicast_src_ip {{ ansible_host }}
          unicast_peer {
      {% for host in groups['apiserver'] if host != inventory_hostname %}
              {{ hostvars[host].ansible_host }}
      {% endfor %}
          }

          track_script {
              check_apiserver
          }
      }
  notify: 重启 keepalived

- name: 启动并设置开机自启
  ansible.builtin.service:
    name: keepalived
    state: started
    enabled: true
