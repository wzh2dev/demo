- name: 安装 keepalived
  ansible.builtin.yum:
    name: keepalived
    state: present

- name: 生成 keepalived 配置
  ansible.builtin.template:
    src: ../templates/keepalived/keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
  notify: 重启 keepalived

- name: 启动并设置开机自启
  ansible.builtin.service:
    name: keepalived
    state: started
    enabled: true
