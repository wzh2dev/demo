- name: 安装 keepalived
  ansible.builtin.yum:
    name: keepalived
    state: present

- name: 生成 keepalived 配置
  ansible.builtin.copy:
    dest: /etc/keepalived/keepalived.conf
    content: |
      global_defs {
          router_id {{ inventory_hostname }}
      }

      vrrp_instance VI_1 {
          state BACKUP
          interface {{ keepalived_interface }}
          virtual_router_id {{ keepalived_router_id }}
          priority {{ keepalived_priority[inventory_hostname] }}
          advert_int 1

          authentication {
              auth_type PASS
              auth_pass {{ keepalived_auth_pass }}
          }

          virtual_ipaddress {
              {{ keepalived_vip }}/24
          }

          unicast_src_ip {{ ansible_host }}
          unicast_peer {
      {% for host in groups['apiserver'] if host != inventory_hostname %}
              {{ hostvars[host].ansible_host }}
      {% endfor %}
          }
      }
  notify: 重启 keepalived

- name: 启动并设置开机自启
  ansible.builtin.service:
    name: keepalived
    state: started
    enabled: true
