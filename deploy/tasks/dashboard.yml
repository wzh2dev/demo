- name: 部署 Kubernetes Dashboard
  block:
    - name: 生成 Kubernetes Dashboard 清单文件
      ansible.builtin.copy:
        src: ../files/dashboard.yaml
        dest: /cluster/k8s/dashboard.yaml

    - name: 应用 Dashboard 清单
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/dashboard.yaml
      register: dashboard_apply_result
      changed_when: "'unchanged' not in dashboard_apply_result.stdout"

    - name: 等待 kubernetes-dashboard 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status deployment/kubernetes-dashboard -n kubernetes-dashboard --timeout=60s
      register: kubernetes_dashboard_ready
      until: kubernetes_dashboard_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: 等待 dashboard-metrics-scraper 就绪
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        rollout status deployment/dashboard-metrics-scraper -n kubernetes-dashboard --timeout=60s
      register: dashboard_metrics_scraper_ready
      until: dashboard_metrics_scraper_ready.rc == 0
      retries: 30
      delay: 10
      changed_when: false

- name: 通过 ingress-nginx 暴露 Dashboard
  block:
    - name: 生成 Dashboard Ingress 清单
      ansible.builtin.template:
        src: ../templates/dashboard/dashboard-ingress.yaml.j2
        dest: /cluster/k8s/dashboard-ingress.yaml

    - name: 应用 Dashboard Ingress
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/dashboard-ingress.yaml
      register: dashboard_ingress_result
      changed_when: "'unchanged' not in dashboard_ingress_result.stdout"

- name: 创建 Dashboard 管理用户
  block:
    - name: 生成 admin 清单
      ansible.builtin.template:
        src: ../templates/dashboard/dashboard-admin.yaml.j2
        dest: /cluster/k8s/dashboard-admin.yaml

    - name: 创建 Dashboard 管理用户
      ansible.builtin.command:
        cmd: >-
          /cluster/k8s/client/bin/kubectl
          --kubeconfig=/cluster/k8s/admin.kubeconfig
          apply -f /cluster/k8s/dashboard-admin.yaml
      register: dashboard_admin_result
      changed_when: "'unchanged' not in dashboard_admin_result.stdout"

    - name: 获取 admin 登录 token
      ansible.builtin.command: >-
        /cluster/k8s/client/bin/kubectl --kubeconfig=/cluster/k8s/admin.kubeconfig
        create token admin -n kubernetes-dashboard
      register: dashboard_admin_token
      changed_when: false

    - name: 输出 Dashboard 登录 token
      ansible.builtin.debug:
        msg: "登录 token（有效期 1 小时）：{{ dashboard_admin_token.stdout | trim }}"
