- name: 移除 k8s 相关目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /cluster/k8s
    - /cluster/helm
    - /cluster/pki
    - /data/etcd
    - /var/lib/kubelet
    - /etc/cni
    - /var/lib/cni
    - /var/lib/calico
    - /var/run/calico

- name: 移除 etcd 部署时生成的配置文件（保留 etcd / etcdctl 安装文件）
  ansible.builtin.file:
    path: /cluster/etcd/etcd.config.yml
    state: absent
