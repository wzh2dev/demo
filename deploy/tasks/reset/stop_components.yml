# 会话不存在时 tmux 返回非 0，属预期情况
# containerd 不在列表中：保留其数据，重启会结束进程且不会自启
- name: 结束 tmux 中的 k8s 常驻进程
  ansible.builtin.command: tmux kill-session -t {{ item }}
  loop:
    - kubelet
    - kube-proxy
    - apiserver
    - controller-manager
    - scheduler
    - etcd
  failed_when: false
  changed_when: false
