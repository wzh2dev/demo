- name: 创建组件安装目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - /cluster/containerd
    - /cluster/runc
    - /etc/containerd

- name: 安装 containerd
  block:
    - name: 下载 containerd 压缩包
      tags: [download]
      ansible.builtin.get_url:
        url: https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-{{ arch }}.tar.gz
        dest: /tmp/containerd.tar.gz
      delegate_to: localhost
      run_once: true
      become: false
      environment:
        https_proxy: "http://10.0.0.1:7897"

    - name: 解压 containerd 到 /cluster/containerd
      ansible.builtin.unarchive:
        src: /tmp/containerd.tar.gz
        dest: /cluster/containerd
        creates: /cluster/containerd/bin/containerd

    - name: 生成 containerd 配置文件
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: |
          version = 2
          root = "/data/containerd"

          [plugins]
            [plugins."io.containerd.grpc.v1.cri"]
              [plugins."io.containerd.grpc.v1.cri".containerd]
                [plugins."io.containerd.grpc.v1.cri".containerd.runtimes]
                  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
                    runtime_type = "io.containerd.runc.v2"
                    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
                      BinaryName = "/cluster/runc/runc"
                      SystemdCgroup = true

              [plugins."io.containerd.grpc.v1.cri".registry]
                [plugins."io.containerd.grpc.v1.cri".registry.mirrors]
                  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.k8s.io"]
                    endpoint = ["https://hub.wuzhenhua.com:8080"]
                  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
                    endpoint = ["https://hub.wuzhenhua.com:8080"]
                  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."quay.io"]
                    endpoint = ["https://hub.wuzhenhua.com:8080"]
                [plugins."io.containerd.grpc.v1.cri".registry.configs]
                  [plugins."io.containerd.grpc.v1.cri".registry.configs."hub.wuzhenhua.com:8080".tls]
                    ca_file = "/cluster/pki/root/root.crt"

- name: 安装 runc
  block:
    - name: 下载 runc
      tags: [download]
      ansible.builtin.get_url:
        url: https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.{{ arch }}
        dest: /tmp/runc.{{ arch }}
      delegate_to: localhost
      run_once: true
      become: false
      environment:
        https_proxy: "http://10.0.0.1:7897"

    - name: 分发 runc 并赋予执行权限
      ansible.builtin.copy:
        src: /tmp/runc.{{ arch }}
        dest: /cluster/runc/runc
        mode: "0755"

- name: 启动并验证 containerd
  block:
    - name: 检查 containerd tmux 会话是否存在
      ansible.builtin.command: tmux has-session -t containerd
      register: containerd_tmux_session
      changed_when: false
      failed_when: false

    - name: 使用 tmux 后台启动 containerd
      ansible.builtin.command: >
        tmux new-session
        -d
        -s containerd
        "/cluster/containerd/bin/containerd --config /etc/containerd/config.toml"
      when: containerd_tmux_session.rc != 0

    - name: 等待 containerd 接口就绪
      ansible.builtin.command: >
        /cluster/containerd/bin/ctr version
      register: containerd_health
      until: containerd_health.rc == 0
      retries: 20
      delay: 3
      changed_when: false
