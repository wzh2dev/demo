# Headless service for stable DNS entries of StatefulSet members.
# 单实例部署，客户端直接连接 mysql-0.mysql:3306。
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
    app.kubernetes.io/name: mysql
spec:
  ports:
  - name: mysql
    port: 3306
  clusterIP: None
  selector:
    app: mysql
