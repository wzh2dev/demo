- name: 下发 ceph 配置文件
  ansible.builtin.template:
    src: ../templates/ceph.conf.j2
    dest: /etc/ceph/ceph.conf
    owner: root
    group: root
    mode: "0644"

- name: 检查 monitor 密钥是否存在
  ansible.builtin.stat:
    path: /etc/ceph/ceph.mon.keyring
  register: ceph_mon_keyring_stat

- name: 下发 monitor 密钥
  ansible.builtin.copy:
    content: "{{ hostvars[groups['mons'][0]].ceph_mon_slurp.results[0].content | b64decode }}"
    dest: /etc/ceph/ceph.mon.keyring
    owner: ceph
    group: ceph
    mode: "0600"
  when: not ceph_mon_keyring_stat.stat.exists

- name: 检查 admin 密钥是否存在
  ansible.builtin.stat:
    path: /etc/ceph/ceph.client.admin.keyring
  register: ceph_admin_keyring_stat

- name: 下发 admin 密钥
  ansible.builtin.copy:
    content: "{{ hostvars[groups['mons'][0]].ceph_mon_slurp.results[1].content | b64decode }}"
    dest: /etc/ceph/ceph.client.admin.keyring
    owner: root
    group: root
    mode: "0600"
  when: not ceph_admin_keyring_stat.stat.exists

- name: 创建 bootstrap-osd 密钥目录
  ansible.builtin.file:
    path: /var/lib/ceph/bootstrap-osd
    state: directory
    owner: ceph
    group: ceph
    mode: "0755"

- name: 检查 bootstrap-osd 密钥是否存在
  ansible.builtin.stat:
    path: /var/lib/ceph/bootstrap-osd/ceph.keyring
  register: ceph_bootstrap_osd_keyring_stat

- name: 下发 bootstrap-osd 密钥
  ansible.builtin.copy:
    content: "{{ hostvars[groups['mons'][0]].ceph_mon_slurp.results[2].content | b64decode }}"
    dest: /var/lib/ceph/bootstrap-osd/ceph.keyring
    owner: ceph
    group: ceph
    mode: "0600"
  when: not ceph_bootstrap_osd_keyring_stat.stat.exists

- name: 检查 monmap 是否存在
  ansible.builtin.stat:
    path: /etc/ceph/ceph.monmap
  register: ceph_monmap_stat

- name: 下发 monmap
  ansible.builtin.copy:
    content: "{{ hostvars[groups['mons'][0]].ceph_mon_slurp.results[3].content | b64decode }}"
    dest: /etc/ceph/ceph.monmap
    owner: root
    group: root
    mode: "0644"
  when: not ceph_monmap_stat.stat.exists

- name: 创建 monitor 数据目录
  ansible.builtin.file:
    path: "/var/lib/ceph/mon/ceph-{{ inventory_hostname }}"
    state: directory
    owner: ceph
    group: ceph
    mode: "0755"

- name: 检查 monitor 是否已初始化
  ansible.builtin.stat:
    path: "/var/lib/ceph/mon/ceph-{{ inventory_hostname }}/store.db"
  register: ceph_mon_store

- name: 初始化 monitor 数据目录
  ansible.builtin.command:
    argv:
      - ceph-mon
      - --cluster
      - ceph
      - --mkfs
      - -i
      - "{{ inventory_hostname }}"
      - --monmap
      - /etc/ceph/ceph.monmap
      - --keyring
      - /etc/ceph/ceph.mon.keyring
      - --setuser
      - ceph
      - --setgroup
      - ceph
  when: not ceph_mon_store.stat.exists

- name: 启动 monitor
  ansible.builtin.service:
    name: "ceph-mon@{{ inventory_hostname }}"
    state: started
    enabled: true

- name: 等待 monitor 组成 quorum
  ansible.builtin.command: ceph -s
  register: ceph_mon_quorum
  until: ceph_mon_quorum.rc == 0
  retries: 30
  delay: 3
  changed_when: false
