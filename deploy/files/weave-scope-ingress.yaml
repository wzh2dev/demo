apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weave-scope
  namespace: weave
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - scope.wuzhenhua.com
  rules:
    - host: scope.wuzhenhua.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weave-scope-app
                port:
                  number: 80
