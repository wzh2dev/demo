# 版本选择原则（k8s 1.27.16）：
# - ingress-nginx / metrics-server：取"官方支持矩阵仍包含 1.27"的最后一个补丁版
# - MetalLB：取最新版，接受 1.27 上的 best-effort
# 升级 k8s 时以上三处的版本都要重算
arch: "amd64"

k8s_version: "1.27.16"
etcd_version: "3.5.13"
containerd_version: "1.7.36"
runc_version: "1.3.6"
crictl_version: "1.37.0"
calico_version: "3.27.5"
coredns_version: "1.10.1"
helm_version: "3.15.4"
dashboard_version: "2.7.0"
ingress_nginx_version: "1.11.8"
metrics_server_version: "0.7.2"
metallb_version: "0.16.0"
