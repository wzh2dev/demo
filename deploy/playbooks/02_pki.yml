- name: 初始化 CA 和节点证书
  hosts: localhost
  tags: [pki]
  pre_tasks:
    - name: 创建 PKI 工作目录
      ansible.builtin.file:
        path: /cluster/pki
        state: directory

  tasks:
    - name: 初始化 CA 和节点证书
      block:
        - name: 初始化并校验根 CA
          ansible.builtin.import_tasks: ../tasks/pki/root_ca.yml

        - name: 初始化并校验 etcd 中间 CA
          ansible.builtin.import_tasks: ../tasks/pki/etcd_ca.yml

        - name: 初始化并校验 k8s 中间 CA
          ansible.builtin.import_tasks: ../tasks/pki/k8s_ca.yml

        - name: 签发并校验 etcd 相关证书
          ansible.builtin.import_tasks: ../tasks/pki/etcd_certificates.yml

        - name: 签发并校验 kube-apiserver 相关证书
          ansible.builtin.import_tasks: ../tasks/pki/apiserver_certificates.yml

        - name: 生成 ServiceAccount 签名密钥对
          ansible.builtin.import_tasks: ../tasks/pki/service_account.yml

        - name: 签发并校验 kube-controller-manager 客户端证书
          ansible.builtin.import_tasks: ../tasks/pki/controller_manager_certificates.yml

        - name: 签发并校验 kube-scheduler 客户端证书
          ansible.builtin.import_tasks: ../tasks/pki/scheduler_certificates.yml

        - name: 签发并校验 admin 客户端证书
          ansible.builtin.import_tasks: ../tasks/pki/admin_certificate.yml
      run_once: true

- name: 分发公共 CA 证书
  hosts: nodes
  become: true
  tags: [pki]
  pre_tasks:
    - name: 创建 PKI 工作目录
      ansible.builtin.file:
        path: /cluster/pki
        state: directory
  tasks:
    - name: 取回并分发 CA 证书
      ansible.builtin.import_tasks: ../tasks/ca.yml
