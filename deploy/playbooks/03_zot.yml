- name: 安装 zot 镜像仓库
  hosts: registry
  become: true
  tags: [zot]
  tasks:
    - ansible.builtin.import_tasks: ../tasks/zot.yml

- name: 安装 skopeo 并预置镜像到 zot
  hosts: registry
  become: true
  tags: [skopeo]
  tasks:
    - ansible.builtin.import_tasks: ../tasks/skopeo.yml

- name: 安装 regctl 并预置镜像到 zot
  hosts: registry
  become: true
  tags: [regctl]
  tasks:
    - ansible.builtin.import_tasks: ../tasks/regctl.yml
