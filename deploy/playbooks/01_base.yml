- name: 节点基础配置
  hosts: nodes
  become: true
  pre_tasks:
    - name: 创建安装目录
      ansible.builtin.file:
        path: "/cluster"
        state: directory

    - name: 创建数据目录
      ansible.builtin.file:
        path: "/data"
        state: directory
  tasks:
    - name: 配置基础系统
      ansible.builtin.import_tasks: ../tasks/base.yml
      tags: [base]

  handlers:
    - name: 重载 SSH 服务
      ansible.builtin.service:
        name: sshd
        state: reloaded
