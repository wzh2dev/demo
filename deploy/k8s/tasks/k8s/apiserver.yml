- name: 分发 kube-apiserver 证书及私钥
  block:
    - name: 分发 kube-apiserver 访问 etcd 的客户端证书及私钥
      ansible.builtin.copy:
        src: /data/ca/etcd/apiserver-etcd-client.{{ item }}
        dest: /data/ca/etcd/
      loop:
        - crt
        - key

    - name: 分发当前节点的 kube-apiserver 服务端证书及私钥
      ansible.builtin.copy:
        src: /data/ca/k8s/apiserver-{{ inventory_hostname }}.{{ item }}
        dest: /data/ca/k8s/
      loop:
        - crt
        - key

    - name: 分发共享的 kube-apiserver 访问 kubelet 的客户端证书及私钥、ServiceAccount 密钥对
      ansible.builtin.copy:
        src: /data/ca/k8s/{{ item }}
        dest: /data/ca/k8s/
      loop:
        - apiserver-kubelet-client.crt
        - apiserver-kubelet-client.key
        - sa.key
        - sa.pub

    - name: 分发 front-proxy 客户端证书及私钥
      ansible.builtin.copy:
        src: /data/ca/front-proxy/front-proxy-client.{{ item }}
        dest: /data/ca/front-proxy/
      loop:
        - crt
        - key

    - name: 分发 apiserver 健康检查客户端证书及私钥
      ansible.builtin.copy:
        src: /data/ca/k8s/apiserver-healthz-client.{{ item }}
        dest: /data/ca/k8s/
      loop:
        - crt
        - key

- name: 部署 kube-apiserver
  block:
    - name: 检查 kube-apiserver 的 tmux 会话是否存在
      ansible.builtin.command: tmux has-session -t apiserver
      register: apiserver_tmux_session
      changed_when: false
      failed_when: false

    - name: 使用 tmux 后台启动 kube-apiserver
      ansible.builtin.command: >-
        tmux new-session -d -s apiserver
        "/cluster/k8s/server/bin/kube-apiserver
        --advertise-address={{ ansible_host }}
        --bind-address=0.0.0.0
        --secure-port=6443
        --etcd-servers={{ etcd_servers }}
        --etcd-cafile=/data/ca/etcd/etcd.crt
        --etcd-certfile=/data/ca/etcd/apiserver-etcd-client.crt
        --etcd-keyfile=/data/ca/etcd/apiserver-etcd-client.key
        --client-ca-file=/data/ca/k8s/k8s.crt
        --tls-cert-file=/data/ca/k8s/apiserver-{{ inventory_hostname }}.crt
        --tls-private-key-file=/data/ca/k8s/apiserver-{{ inventory_hostname }}.key
        --kubelet-certificate-authority=/data/ca/k8s/k8s.crt
        --kubelet-client-certificate=/data/ca/k8s/apiserver-kubelet-client.crt
        --kubelet-client-key=/data/ca/k8s/apiserver-kubelet-client.key
        --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP
        --requestheader-client-ca-file=/data/ca/front-proxy/front-proxy-ca.crt
        --requestheader-allowed-names=front-proxy-client
        --requestheader-username-headers=X-Remote-User
        --requestheader-group-headers=X-Remote-Group
        --requestheader-extra-headers-prefix=X-Remote-Extra-
        --proxy-client-cert-file=/data/ca/front-proxy/front-proxy-client.crt
        --proxy-client-key-file=/data/ca/front-proxy/front-proxy-client.key
        --service-account-key-file=/data/ca/k8s/sa.pub
        --service-account-signing-key-file=/data/ca/k8s/sa.key
        --service-account-issuer=https://kubernetes.default.svc.{{ cluster_domain }}
        --service-cluster-ip-range={{ service_cluster_ip_range }}
        --enable-bootstrap-token-auth=true
        --authorization-mode=Node,RBAC
        --anonymous-auth=false
        --enable-admission-plugins=NodeRestriction
        --allow-privileged=true
        --v=2"
      when: apiserver_tmux_session.rc != 0

- name: 验证 kube-apiserver 完成引导并注册节点
  block:
    - name: 等待 kube-apiserver 健康检查通过
      ansible.builtin.command: >
        curl -fsS
        --cacert /data/ca/k8s/k8s.crt
        --cert /data/ca/k8s/apiserver-healthz-client.crt
        --key /data/ca/k8s/apiserver-healthz-client.key
        https://127.0.0.1:6443/healthz
      register: apiserver_health
      until: apiserver_health.rc == 0
      retries: 10
      delay: 5
      changed_when: false

    - name: 查看 kube-apiserver 版本
      ansible.builtin.command: >
        curl -fsS
        --cacert /data/ca/k8s/k8s.crt
        --cert /data/ca/k8s/apiserver-healthz-client.crt
        --key /data/ca/k8s/apiserver-healthz-client.key
        https://127.0.0.1:6443/version
      changed_when: false
