- name: 写入集群主机名映射
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED CLUSTER HOSTS"
    block: |
      {% for host in groups['nodes'] %}
      {{ hostvars[host].ansible_host }} {{ host }}.wuzhenhua.com {{ host }}
      {% endfor %}

- name: 关闭 swap
  block:
    - name: 关闭当前启用的 swap
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: ansible_swaptotal_mb | int > 0

    - name: 注释 fstab 中启用的 swap 条目
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: "^([^#].*swap.*)"
        replace: '#\1'

- name: 关闭 SELinux
  when: ansible_os_family == 'RedHat'
  block:
    - name: 临时关闭 SELinux
      ansible.builtin.command: setenforce 0
      when:
        - ansible_selinux.status | default('disabled') == 'enabled'
        - ansible_selinux.mode | default('permissive') == 'enforcing'

    - name: 永久关闭 SELinux
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: "^SELINUX="
        line: SELINUX=disabled

    - name: 重启使 SELinux 配置生效
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: ansible_selinux.status | default('disabled') != 'disabled'

- name: 配置 root SSH 访问
  block:
    - name: 设置 root 密码
      ansible.builtin.user:
        name: root
        password: "{{ 'root' | password_hash('sha512') }}"

    - name: 允许 root 远程登录
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^[ \t#]*PermitRootLogin'
        line: "PermitRootLogin yes"
        validate: /usr/sbin/sshd -t -f %s
      notify: 重载 SSH 服务

    - name: 允许密码认证
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^[ \t#]*PasswordAuthentication'
        line: "PasswordAuthentication yes"
        validate: /usr/sbin/sshd -t -f %s
      notify: 重载 SSH 服务

    - name: 应用 SSH 配置变更
      ansible.builtin.meta: flush_handlers

- name: 配置阿里云 yum 源
  when: ansible_os_family == 'RedHat'
  block:
    - name: 获取阿里云 CentOS 7 repo 文件
      ansible.builtin.uri:
        url: https://mirrors.aliyun.com/repo/Centos-7.repo
        return_content: true
      register: aliyun_base_repo_content
      check_mode: false
      changed_when: false

    - name: 写入 CentOS-Base 源并关闭签名校验
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/CentOS-Base.repo
        content: '{{ aliyun_base_repo_content.content | replace("gpgcheck=1", "gpgcheck=0") | regex_replace("(?m)^.*mirrors\.(cloud\.)?aliyuncs\.com.*\n", "") }}'
      register: aliyun_base_repo

    - name: 下载阿里云 EPEL 7 repo 文件
      ansible.builtin.get_url:
        url: https://mirrors.aliyun.com/repo/epel-7.repo
        dest: /etc/yum.repos.d/epel.repo
      register: aliyun_epel_repo

    - name: 清理 yum 缓存
      ansible.builtin.command: yum clean all
      when: aliyun_base_repo is changed or aliyun_epel_repo is changed

    - name: 重建 yum 缓存
      ansible.builtin.command: yum makecache
      when: aliyun_base_repo is changed or aliyun_epel_repo is changed
      changed_when: false

- name: 配置阿里云 apt 源
  when: ansible_os_family == 'Debian'
  block:
    - name: 替换为阿里云 apt 源
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: 'http://(archive|security)\.ubuntu\.com/ubuntu/?'
        replace: "https://mirrors.aliyun.com/ubuntu/"

    - name: 更新 apt 缓存
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

- name: 安装基础软件包
  ansible.builtin.package:
    name:
      - iptables
      - tmux
    state: present
