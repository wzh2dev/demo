- name: 创建根 CA 工作目录
  ansible.builtin.file:
    path: /data/ca/root
    state: directory

- name: 生成根 CA 私钥
  ansible.builtin.command: openssl genrsa -aes256 -out /data/ca/root/root.key -passout pass:root 4096
  args:
    creates: /data/ca/root/root.key

- name: 写入根 CA 自签名证书配置
  ansible.builtin.copy:
    dest: /data/ca/root/root.cnf
    content: |
      [ req ]
      prompt             = no
      distinguished_name = req_distinguished_name

      [ req_distinguished_name ]
      C  = CN
      ST = Jiangsu
      L  = Nanjing
      O  = Wuzhenhua
      OU = IT
      CN = Root CA

      [ v3_ca ]
      basicConstraints       = critical, CA:true, pathlen:1
      keyUsage               = critical, keyCertSign, cRLSign
      subjectKeyIdentifier   = hash
      authorityKeyIdentifier = keyid:always

- name: 生成根 CA 自签名证书
  ansible.builtin.command: >
    openssl req -x509 -new
    -config /data/ca/root/root.cnf
    -extensions v3_ca
    -key /data/ca/root/root.key
    -passin pass:root
    -out /data/ca/root/root.crt
    -days 3650
    -sha256
  args:
    creates: /data/ca/root/root.crt

- name: 校验根 CA 证书
  ansible.builtin.command: openssl verify -CAfile /data/ca/root/root.crt /data/ca/root/root.crt
  changed_when: false

- name: 创建根 CA 的 newcerts / crl 目录
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - /data/ca/root/newcerts
    - /data/ca/root/crl

- name: 初始化根 CA 的证书数据库 index.txt
  ansible.builtin.file:
    path: /data/ca/root/index.txt
    state: touch
    modification_time: preserve
    access_time: preserve

- name: 初始化根 CA 的 serial / crlnumber
  ansible.builtin.copy:
    content: "1000"
    dest: "{{ item }}"
    force: false
  loop:
    - /data/ca/root/serial
    - /data/ca/root/crlnumber

- name: 写入根 CA 签发配置
  ansible.builtin.copy:
    dest: /data/ca/root/root_ca.cnf
    content: |
      [ ca ]
      default_ca = ca_default

      [ ca_default ]
      dir             = /data/ca/root
      crl_dir         = $dir/crl
      new_certs_dir   = $dir/newcerts
      database        = $dir/index.txt
      serial          = $dir/serial
      crlnumber       = $dir/crlnumber

      policy          = policy_strict

      unique_subject  = yes
      copy_extensions = none

      [ policy_strict ]
      countryName            = match
      stateOrProvinceName    = match
      localityName           = match
      organizationName       = match
      organizationalUnitName = supplied
      commonName             = supplied
      emailAddress           = optional
