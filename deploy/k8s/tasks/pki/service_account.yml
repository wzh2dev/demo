- name: 生成 ServiceAccount 签名密钥对
  block:
    - name: 生成 ServiceAccount 签名私钥
      ansible.builtin.command: openssl genrsa -out /cluster/pki/k8s/sa.key 2048
      args:
        creates: /cluster/pki/k8s/sa.key

    - name: 导出 ServiceAccount 验证公钥
      ansible.builtin.command: >
        openssl rsa
        -in /cluster/pki/k8s/sa.key
        -pubout
        -out /cluster/pki/k8s/sa.pub
      args:
        creates: /cluster/pki/k8s/sa.pub
