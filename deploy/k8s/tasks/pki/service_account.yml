- name: 生成 ServiceAccount 签名密钥对
  block:
    - name: 生成 ServiceAccount 签名私钥
      ansible.builtin.command: openssl genrsa -out /data/ca/k8s/sa.key 2048
      args:
        creates: /data/ca/k8s/sa.key

    - name: 导出 ServiceAccount 验证公钥
      ansible.builtin.command: >
        openssl rsa
        -in /data/ca/k8s/sa.key
        -pubout
        -out /data/ca/k8s/sa.pub
      args:
        creates: /data/ca/k8s/sa.pub
