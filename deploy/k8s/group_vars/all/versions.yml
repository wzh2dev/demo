# - ingress-nginx / metrics-server：取"官方支持矩阵仍包含 1.27"的最后一个补丁版
# - MetalLB：取最新版，接受 1.27 上的 best-effort
# - Weave Net：2.8.1 是主线最后一个版本，1.27 上 best-effort
# - Weave Scope：1.13.2 是最后版本（项目已归档），仅用于集群可视化
# 升级 k8s 时以上五处的版本都要重算
arch: "amd64"

