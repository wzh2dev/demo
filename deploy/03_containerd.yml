- name: 创建组件安装目录
  ansible.builtin.file:
    path: "/cluster/containerd"
    state: directory

- name: 创建组件安装目录
  ansible.builtin.file:
    path: "/cluster/runc"
    state: directory

- name: 下载 containerd 压缩包
  ansible.builtin.get_url:
    url: https://github.com/containerd/containerd/releases/download/v1.7.36/containerd-1.7.36-linux-amd64.tar.gz
    dest: /tmp/containerd.tar.gz
  environment:
    http_proxy: http://192.168.1.1:7897
    https_proxy: http://192.168.1.1:7897

- name: 解压 containerd 到 /cluster/containerd
  ansible.builtin.unarchive:
    src: /tmp/containerd.tar.gz
    dest: /cluster/containerd
    remote_src: true
    creates: /cluster/containerd/bin/containerd

- name: 下载 runc 并赋予执行权限
  ansible.builtin.get_url:
    url: https://github.com/opencontainers/runc/releases/download/v1.4.3/runc.amd64
    dest: /cluster/runc/runc
    mode: "0755"
  environment:
    http_proxy: http://192.168.1.1:7897
    https_proxy: http://192.168.1.1:7897

- name: 检查 containerd tmux 会话是否存在
  ansible.builtin.command: tmux has-session -t containerd
  register: containerd_tmux_session
  changed_when: false
  failed_when: false

- name: 使用 tmux 后台启动 containerd
  ansible.builtin.command: >
    tmux new-session
    -d
    -s containerd
    /cluster/containerd/bin/containerd
  when: containerd_tmux_session.rc != 0

- name: 等待 containerd 接口就绪
  ansible.builtin.command: >
    /cluster/containerd/bin/ctr
    --address /run/containerd/containerd.sock
    version
  register: containerd_health
  until: containerd_health.rc == 0
  retries: 20
  delay: 3
  changed_when: false
